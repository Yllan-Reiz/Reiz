<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rejoins mon cercle sur Reiz</title>
<meta property="og:title" content="Rejoins mon cercle sur Reiz" />
<meta property="og:description" content="Mon cercle voit ma progression chaque jour. Pas d'excuse, pas d'abandon. Viens." />
<style>
  :root { --bg:#0a0a0a; --card:#141414; --line:#262626; --txt:#ffffff; --muted:#8a8a8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--txt); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
    border-radius:24px; padding:32px 26px; text-align:center;
  }
  .logo { width:96px; height:auto; margin:0 auto 22px; display:block; }
  h1 { font-size:23px; font-weight:800; line-height:1.25; margin-bottom:10px; }
  h1 .name { color:#fff; }
  p.sub { color:var(--muted); font-size:15px; line-height:1.5; margin-bottom:26px; }
  .btn {
    display:block; width:100%; padding:16px; border-radius:14px; font-size:16px;
    font-weight:700; text-decoration:none; margin-bottom:12px; border:none; cursor:pointer;
  }
  .btn-primary { background:#fff; color:#000; }
  .btn-secondary { background:transparent; color:#fff; border:1px solid var(--line); }
  .fallback { margin-top:22px; padding-top:20px; border-top:1px solid var(--line); }
  .fallback p { color:var(--muted); font-size:13px; line-height:1.6; }
  .tag { color:#fff; font-weight:700; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo-reiz.png" alt="Reiz" class="logo" />
    <h1 id="title">Tu es invité<span id="byName"></span> dans un cercle Reiz.</h1>
    <p class="sub">Sur Reiz, ton cercle voit ta progression chaque jour. Pas d'excuse, pas d'abandon.</p>

    <a class="btn btn-primary" id="openApp" href="#">Ouvrir dans Reiz →</a>
    <a class="btn btn-secondary" id="download" href="https://reiz-landing.netlify.app">Télécharger l'app</a>

    <div class="fallback" id="fallback">
      <p>
        Déjà l'app installée ? Touche « Ouvrir dans Reiz ».<br />
        Sinon, télécharge-la puis <span id="searchHint">cherche ton parrain dans l'onglet Amis</span>.
      </p>
    </div>
  </div>

  <script>
    (function () {
      // Récupère le pseudo du parrain (?ref=pseudo) et construit le deep link natif.
      var params = new URLSearchParams(window.location.search);
      var ref = (params.get('ref') || '').replace(/^@/, '').trim();

      var openApp = document.getElementById('openApp');
      var byName = document.getElementById('byName');
      var searchHint = document.getElementById('searchHint');

      if (ref) {
        // Lien natif : ouvre l'app si installée et déclenche l'auto-ajout.
        openApp.setAttribute('href', 'reiz://invite?ref=' + encodeURIComponent(ref));
        byName.textContent = ' par @' + ref;
        searchHint.innerHTML = 'cherche <span class="tag">@' + ref + '</span> dans l\'onglet Amis';
      } else {
        // Sans parrain identifié : on ouvre simplement l'app.
        openApp.setAttribute('href', 'reiz://');
      }
    })();
  </script>
</body>
</html>
