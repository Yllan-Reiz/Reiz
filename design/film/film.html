<script>
'use strict';
/* =========================================================
   Format, temps
   ========================================================= */
const Q = new URLSearchParams(location.search);
const FMT = Q.get('fmt') === 'v' ? 'v' : 'h';
const LAY = FMT === 'h' ? {
  W: 1920, H: 1080, persp: 2400,
  ph: { x: 190, y: -10, s: 1 },
  p2: { c: { x: 0, y: -40, s: .9 }, dx: 580, sy: -20, z: -520, s: .86, ry: 30 },
  zoom: { s: 1.95, cx: 1150, cy: 520 },
  duo: { s: 1.4, cx: 1180, cy: 600 },
  p7: { s0: 2.4, s1: 2.25, cx: 1150, cy: 520 },

      vis(flyer, clamp(P(t, 17.95, 18.1)) * (1 - E.inCubic(P(t, 18.85, 19.05))));
    } else vis(flyer, 0);
  }

  /* ---------- plans 5 et 6 : le cercle, le duo ---------- */
  const DP = duoPose();
  if (t >= 18.1 && t < 25.3) {
    const inn = E.outQuint(P(t, 18.1, 19.2)), push = E.inOutCubic(P(t, 23.15, 24.1)), out = E.inOutCubic(P(t, 24.55, 25.1));
    const ry = lerp(-34, -6, inn) + 4 * E.inOutSine(P(t, 19, 23));
    filPose = { x: lerp(lerp(LAY.ph.x + (FMT === 'h' ? 630 : 560), LAY.ph.x, inn), DP.x, push), y: lerp(LAY.ph.y, DP.y, push), s: lerp(LAY.ph.s, DP.s, push) };
    place(PH.fil, { x: filPose.x, y: filPose.y, z: lerp(-300, 0, inn), ry: ry * (1 - push), s: filPose.s, op: inn * (1 - out), blur: out * 10 });
    PH.fil.querySelector('.screen').style.filter = (t > 21 && t < 25.3) ? `blur(${(1.6 * E.outCubic(P(t, 21.0, 21.5)) * (1 - E.outCubic(P(t, 23.0, 23.5)))).toFixed(2)}px)` : 'none';
    [[0, [19.45, 20.05, 20.5]], [1, [19.75, 20.6]], [2, [20.25]]].forEach(([i, times]) => {
      const n = times.filter(a => t >= a).length, x = document.getElementById('f-x' + i);
      x.style.display = n > 0 ? 'flex' : 'none'; x.style.transform = `scale(${clamp(spring(t, times[0], .5))})`; setNum(`f-x${i}c`, String(n));
    });
    setNum('f-cc', t >= 21.3 ? '2' : t >= 20.8 ? '1' : 'Commenter');
    setNum('f-when', t < 22.5 ? "À l'instant" : 'Il y a 2 min');
    const bd = document.getElementById('f-bd'), bs = spring(t, 21.95, .45); bd.style.opacity = clamp(bs); bd.style.transform = `scale(${clamp(bs)})`;
    const duo = document.getElementById('f-duo'), ds = spring(t, 23.35, .5);
    duo.style.display = t >= 23.3 ? 'flex' : 'none';
    duo.style.transform = `scale(${clamp(ds) * (1 - .05 * Math.sin(Math.PI * P(t, 24.2, 24.45)))})`;
    duo.style.boxShadow = `0 0 ${(20 * Math.sin(Math.PI * P(t, 23.6, 24.4))).toFixed(1)}px rgba(255,255,255,.6)`;
    duo.style.opacity = 1 - P(t, 24.5, 24.6);
  }
  FLO.forEach((fl, i) => {
    const e = floEls[i], k = P(t, fl.a, fl.a + 1.25);
    if (k <= 0 || k >= 1 || t > 22.5) { vis(e, 0); return; }
    const [rx0, ry0] = toStage(filPose, G.react.x + G.react.w / 2, G.react.y);
    const x = rx0 - 15 + fl.dx + Math.sin(k * 6 + fl.ph) * fl.sw, y = ry0 - k * 330 * LAY.floatK;
    e.style.transform = `translate(${x}px,${y}px) scale(${(.7 + E.outCubic(clamp(k * 3)) * .5) * LAY.floatK})`;
    vis(e, Math.min(clamp(k * 6), 1 - E.inCubic(P(k, .55, 1))));
  });
  {
    const NK = LAY.notif.k, X = LAY.notif.cx - 620 * NK / 2;
    const a1 = spring(t, 21.0, .7), o1 = 1 - E.inOutCubic(P(t, 22.3, 22.75));
    vis(n1, clamp(a1 * 1.4) * o1); n1.style.transform = `translate(${X}px,${lerp(LAY.notif.y - 280, LAY.notif.y, clamp(a1)) - 150 * E.inCubic(P(t, 22.3, 22.75))}px) scale(${lerp(.96, 1, clamp(a1)) * NK})`;
    const a2 = spring(t, 22.55, .7), o2 = 1 - E.inOutCubic(P(t, 24.0, 24.5));
    vis(n2, clamp(a2 * 1.4) * o2); n2.style.transform = `translate(${X}px,${lerp(LAY.notif.y - 280, LAY.notif.y, clamp(a2)) - 150 * E.inCubic(P(t, 24.0, 24.5))}px) scale(${lerp(.96, 1, clamp(a2)) * NK})`;
  }
  {
    const a = P(t, 24.5, 25.25);
    if (a > 0 && a < 1) {
      const k = E.inOutQuint(a), s0 = LAY.p7.s0, bw = G.duo.w * DP.s, bh = G.duo.h * DP.s;
      const [ex, eyc] = toStage(p7Pose(s0), G.bar.x, G.bar.y - SCR7), ew = G.bar.w * s0;
      bridge.style.width = lerp(bw, ew, k) + 'px'; bridge.style.height = lerp(bh, 3, k) + 'px'; bridge.style.borderRadius = lerp(bh / 2, 2, k) + 'px';
      bridge.style.transform = `translate(${lerp(LAY.duo.cx - bw / 2, ex, k)}px,${lerp(LAY.duo.cy - bh / 2, eyc - 1, k)}px)`;
      vis(bridge, clamp(P(t, 24.5, 24.62)) * (1 - E.inCubic(P(t, 25.0, 25.25))));
    } else vis(bridge, 0);
  }

  /* ---------- plan 7 : régularité ---------- */
  const cells = PH.pLow.querySelectorAll('#pl-heat i');
  if (t >= 24.8 && t < 28.6) {
    const inn = E.outCubic(P(t, 24.85, 25.4)), s = lerp(LAY.p7.s0, LAY.p7.s1, E.inOutSine(P(t, 25, 28.2))), out = E.inCubic(P(t, 28.05, 28.45));
    const pose = p7Pose(s);
    place(PH.pLow, { x: pose.x, y: pose.y, s, op: inn * (1 - out), br: 1 - out * .5 });
    setScroll('pl', SCR7);
    let lit = 0;
    ACTIVE.forEach((ci, k) => {
      const at = 25.25 + 2.1 * Math.pow(k / (ACTIVE.length - 1), .62), on = t >= at; if (on) lit++;
      const g = clamp(P(t, at, at + .25));
      cells[ci].style.background = on ? '#fff' : '#1e1e1e';
      cells[ci].style.boxShadow = on ? `0 0 ${(10 * (1 - g) + 2).toFixed(1)}px rgba(255,255,255,${(.9 * (1 - g) + .2).toFixed(2)})` : 'none';
    });
    setNum('pl-ft', `${lit} jours sur les 30 derniers`);
    const fs = spring(t, 26.0, .6);
    const [fx, fy] = toStage(pose, G.ocp.x + G.ocp.w, G.ocp.y - SCR7);
    vis(flame, clamp(fs) * (1 - out)); flame.style.transform = `translate(${Math.min(fx - 120, W - 190)}px,${lerp(fy - 40, fy - 78, clamp(fs))}px) scale(${lerp(.9, 1, clamp(fs))})`;
    setNum('flN', Math.round(lerp(1, 12, E.outCubic(P(t, 26.0, 27.2)))) + 'j');
  } else {
    vis(flame, 0);
    cells.forEach((c, i) => { c.style.background = ACTIVE.includes(i) ? '#fff' : '#1e1e1e'; c.style.boxShadow = 'none'; });
  }
  {
    const a = P(t, 28.0, 28.55);
    if (a > 0 && a < 1) {
      const pose = p7Pose(LAY.p7.s1);
      ACTIVE.forEach((ci, k) => {
        const c = G.cells[ci], [X, Y] = toStage(pose, c.x + 6, c.y - SCR7 + 6);
        const kk = E.inExpo(clamp(a * 1.15 - k * .004));
        cellPs[k].style.transform = `translate(${lerp(X, LAY.hero.x, kk) - 14}px,${lerp(Y, LAY.hero.y, kk) - 14}px) scale(${lerp(pose.s / 2.4, .15, kk)})`;
        vis(cellPs[k], (a < .02 ? a * 50 : 1) * (1 - P(a, .9, 1)));
      });
    } else cellPs.forEach(c => vis(c, 0));
  }

  /* ---------- plan 8 : la collection ---------- */
  const flare = Math.max(0, Math.sin(Math.PI * P(t, 28.45, 29.1)));
  {
    const on = t > 28.6 && t < 31.6, CL = LAY.coll, ncol = CL.cols.length, dolly = E.inOutCubic(P(t, 30.75, 31.45));
    coll.forEach((b, i) => {
      if (!on) { vis(b, 0); return; }
      const r = Math.floor(i / ncol), c = i % ncol;
      const d = (i * 7 % 12) / 12, e = E.outExpo(P(t, 28.75 + d * .45, 28.75 + d * .45 + 1.1));
      const X = lerp(LAY.hero.x, CL.cols[c], e), Y = lerp(LAY.hero.y, CL.rows[r], e);
      const edge = c === 0 || c === ncol - 1, side = c < (ncol - 1) / 2 ? 1 : c > (ncol - 1) / 2 ? -1 : 0;
      const ry = side * (edge ? 22 : 8) + 12 * Math.sin(t * .9 + i), isPP = i === 0;
      let x = X, y = Y, z = edge ? -140 : -30, s = lerp(.2, 1, e), o = e;
      if (isPP) { x = lerp(X, LAY.hero.x, dolly); y = lerp(Y, LAY.hero.y, dolly); z = lerp(z, 0, dolly); s *= lerp(1, HS / CS, dolly); o *= 1 - P(t, 31.2, 31.35); }
      else { z -= 600 * dolly; o *= 1 - dolly; }
      b.style.transform = `translate3d(${x - CX}px,${y - CY}px,${z}px) rotateY(${ry * (isPP ? 1 - dolly : 1)}deg) scale(${s})`;
      b.style.filter = `blur(${((1 - e) * 12 + (isPP ? 0 : dolly * 8) + (edge && ncol === 4 ? 1.2 : 0)).toFixed(2)}px) brightness(${(1 + flare * .3).toFixed(2)})`;
      vis(b, o);
      const tb = 29.35 + (CL.cols[c] - CL.cols[0]) / (CL.cols[ncol - 1] - CL.cols[0] + 1) * 1.1 + r * .06;
      b.querySelector('.sh').style.backgroundPosition = `${lerp(130, -30, clamp(P(t, tb - .35, tb + .35))).toFixed(1)}% 0`;
    });
  }

  /* ---------- plan 9 : montée de niveau ---------- */
  const LT = [31.25, 32.5, 33.75, 34.375, 35.0, 35.625], HW = .26, HR = LAY.hero;
  if (t > 31.1 && t < 37.9) {
    let show = 0, ang = 9 * Math.sin((t - 31.25) * 1.15);
    for (let k = 0; k < 6; k++) if (t >= LT[k]) show = k;
    for (let k = 1; k < 6; k++) { const d = t - LT[k]; if (d > -HW && d < HW) { const u = (d + HW) / (2 * HW); if (u < .5) { ang = ang * (1 - u * 2) + 90 * E.inOutSine(u * 2); show = k - 1; } else { ang = -90 + 90 * E.outCubic((u - .5) * 2); show = k; } } }
    if (t < LT[1] - HW) show = 0;
    const src = `assets/pp${show + 1}.png`;
    if (heroImg.getAttribute('src') !== src) { heroImg.setAttribute('src', src); heroSh.style.webkitMaskImage = heroSh.style.maskImage = `url(${src})`; }
    const inn = E.outCubic(P(t, 31.2, 31.5)), leave = E.inOutCubic(P(t, 37.05, 37.75));
    const [tx, ty] = toStage(LAY.ph, G.b0.x + G.b0.w / 2, G.b0.y + G.b0.h / 2);
    const x = lerp(HR.x, tx, leave), y = lerp(HR.y, ty, leave) - Math.sin(Math.PI * leave) * 60, sc = lerp(1, 62 * LAY.ph.s / HS, leave);
    hero.style.transform = `translate3d(${x - CX}px,${y - CY}px,0) rotateY(${(ang * (1 - leave)).toFixed(2)}deg) scale(${sc})`;
    vis(hero, inn * (1 - P(t, 37.7, 37.8)));
    {
      const ar = ang * Math.PI / 180, sn = Math.abs(Math.sin(ar)), co = Math.cos(ar);
      const w = 34 * sn * sc * HS / 440, h = HS * .76 * sc, off = Math.sign(ang || 1) * HS * .455 * sc * co * .85;
      heroEdge.style.width = w + 'px'; heroEdge.style.height = h + 'px';
      heroEdge.style.transform = `translate(${x + off - w / 2}px,${y - h / 2}px)`;
      heroEdge.style.background = `linear-gradient(180deg,rgba(255,255,255,0),${LV[show].e} 22%,#fff 50%,${LV[show].e} 78%,rgba(255,255,255,0))`;
      heroEdge.style.boxShadow = `0 0 ${24 * sc}px ${LV[show].g}`;
      vis(heroEdge, clamp((sn - .6) / .3) * inn * (1 - leave));
    }
    const sp = P(t, LT[show] + .02, LT[show] + .9), sp6 = P(t, 36.05, 36.95);
    heroSh.style.backgroundPosition = `${(show === 5 && t > 36 ? lerp(130, -30, E.inOutSine(sp6)) : lerp(130, -30, E.inOutSine(sp))).toFixed(1)}% 0`;
    const back6 = show === 5 ? Math.sin(Math.PI * P(t, 35.6, 36.4)) : 0;
    heroImg.style.filter = `brightness(${(1 + back6 * .15).toFixed(3)}) drop-shadow(0 0 ${(20 + back6 * 40).toFixed(0)}px ${LV[show].g})`;
    const gs = (HS / 440) * (560 + show * 60 + back6 * 180);
    heroGlow.style.width = heroGlow.style.height = gs + 'px'; heroGlow.style.left = (x - gs / 2) + 'px'; heroGlow.style.top = (y - gs / 2) + 'px';
    heroGlow.style.background = `radial-gradient(closest-side,${LV[show].g},rgba(0,0,0,0))`;
    vis(heroGlow, inn * (1 - leave));
    drawSparks(t, x, y, 300 * HS / 440, (show >= 4 ? (show === 5 ? 1 : .45) : 0) * (1 - leave), show === 5 ? '255,196,120' : '205,160,255');
    ticks.forEach((tk, k) => {
      vis(tk, E.outCubic(P(t, 31.6 + k * .05, 32.1 + k * .05)) * (1 - E.inCubic(P(t, 36.9, 37.3))));
      tk.style.transform = `translate(${HR.x + (k - 2.5) * HR.gap - HR.tick / 2}px,${HR.tickY - HR.tick / 2}px)`;
      const cur = k === show, done = k <= show, im = tk.querySelector('img');
      tk.style.color = cur ? (k === 5 ? '#F2B660' : '#fff') : done ? '#8a8a92' : '#4a4a50';
      im.style.opacity = cur ? 1 : done ? .7 : .28; im.style.filter = cur ? `drop-shadow(0 0 12px ${LV[k].g})` : 'none'; im.style.transform = `scale(${cur ? 1.12 : 1})`;
    });
  } else { vis(hero, 0); vis(heroGlow, 0); vis(heroEdge, 0); ticks.forEach(k => vis(k, 0)); drawSparks(t, 0, 0, 0, 0, '0,0,0'); }

  /* ---------- plan 10 : profil ---------- */
  if (t > 37.0 && t < 40.9) {
    const inn = E.outCubic(P(t, 37.1, 37.8)), out = E.inOutCubic(P(t, 39.85, 40.7));
    place(PH.pTop, { x: LAY.ph.x, y: LAY.ph.y, z: lerp(-200, 0, inn) - 700 * out, ry: lerp(-12, -3, E.inOutSine(P(t, 37.1, 40))), s: LAY.ph.s, op: inn * (1 - out), blur: out * 6 });
    setScroll('pt', 0);
    const b0 = document.getElementById('pt-b0'); b0.style.opacity = t < 37.72 ? 0 : 1; b0.style.transform = `scale(${1 + .12 * Math.sin(Math.PI * P(t, 37.72, 38.05))})`;
    const k = E.outCubic(P(t, 37.8, 38.7));
    setNum('pt-s1', Math.round(12 * k) + 'j'); setNum('pt-s2', String(Math.round(48 * k))); setNum('pt-s3', String(Math.round(10 * k)));
    setNum('pt-tk', t >= 38.6 ? '+4' : '+3');
    const tk = document.getElementById('pt-tk'); tk.style.color = t >= 38.6 ? '#fff' : '#888'; tk.parentElement.style.transform = `scale(${1 + .06 * Math.sin(Math.PI * P(t, 38.6, 38.9))})`;
  } else document.getElementById('pt-b0').style.opacity = 1;

  /* ---------- plan 11 : couronne autour du logo ---------- */
  if (t > 40.1) {
    canonical();
    const a = E.outCubic(P(t, 40.1, 40.9)), rec = E.inCubic(P(t, 40.9, 41.7)), orbit = (t - 40.1) * 9, O = LAY.orbit, oy = LG.cy - CY;
    if (t < 41.8) [[PH.obj, 0], [PH.post, 90], [PH.fil, 180], [PH.pLow, 270]].forEach(([p, base]) => {
      const ang = (base + orbit + 45) * Math.PI / 180;
      place(p, { x: Math.cos(ang) * O.rx, y: oy + Math.sin(ang) * O.ry, z: -420 - 1500 * rec, ry: -Math.cos(ang) * 26, rx: Math.sin(ang) * 8, s: O.s, op: a * (1 - rec), blur: 1.5 + rec * 8, br: .72 });
    });
    orbB.forEach((b, i) => {
      const ang = (i * 90 + orbit) * Math.PI / 180;
      b.style.transform = `translate3d(${Math.cos(ang) * O.brx}px,${oy + Math.sin(ang) * O.bry}px,${-300 - 1300 * rec}px) rotateY(${Math.sin(t + i) * 20}deg)`;
      b.style.filter = `blur(${(1.5 + rec * 6).toFixed(1)}px)`;
      vis(b, E.outCubic(P(t, 40.0 + i * .1, 40.7 + i * .1)) * (1 - rec) * .85);
    });
  } else orbB.forEach(b => vis(b, 0));

  drawDust(t, t < 9 ? E.outCubic(P(t, .2, 2)) * (1 - P(t, 7, 9)) * .9 : t > 39.5 ? E.outCubic(P(t, 39.5, 41)) * .9 * (1 - E.inOutSine(P(t, 43.9, 44.6))) : .22);
  $('#bg').style.filter = flare > .01 ? `brightness(${1 + flare * 1.5})` : 'none';
  renderCaption(t);
  drawGrain(f);
  vis($('#black'), tReal < .25 ? 1 - tReal / .25 : 0);
}

window.__ready = false;
const frame2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => { }))]).then(async () => {
  // polices : on force leur chargement et on recharge la page si l'une d'elles manque
  await Promise.all(['400', '500', '600', '700', '800', '900'].map(w => document.fonts.load(`${w} 16px Inter`)).concat(document.fonts.load('16px Ionicons'))).catch(() => { });
  if ([...document.fonts].some(f => f.status !== 'loaded')) { location.reload(); return; }
  // images : toutes doivent être chargées (celles du DOM et celles utilisées en fond ou en masque)
  const extra = [PHOTO, 'assets/ecriture-reiz-blanc-trim.png', ...[1, 2, 3, 4, 5, 6].map(i => `assets/pp${i}.png`), ...BNAMES.map(n => `assets/b-${n}.png`)];
  const okExtra = await Promise.all(extra.map(src => new Promise(r => { const im = new Image(); im.onload = () => r(im.naturalWidth > 0); im.onerror = () => r(false); im.src = src; })));
  if ([...document.images].some(i => !i.complete || i.naturalWidth === 0) || okExtra.includes(false)) { location.reload(); return; }
  measure();
  // préchauffage : chaque masque et chaque badge est peint une fois avant le rendu
  for (const tt of [2, 4.5, 6.5, 10, 12.5, 14.5, 17.5, 19.5, 21, 22.4, 22.8, 23.3, 24.2, 25.2, 26.5, 27.6, 29.5, 31.5, 33.5]) { render(tt); await frame2(); }
  await new Promise(r => setTimeout(r, 400));
  render(parseFloat(Q.get('t') || '0'));
  await frame2();
  window.__ready = true;
});
</script>
