<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reiz, film de lancement</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter_400Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter_500Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter_600SemiBold.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter_700Bold.ttf)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/Inter_800ExtraBold.ttf)}
@font-face{font-family:Inter;font-weight:900;src:url(fonts/Inter_900Black.ttf)}
@font-face{font-family:Ionicons;src:url(fonts/Ionicons.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,"Apple Color Emoji",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.ion{font-family:Ionicons;font-style:normal;font-weight:normal;line-height:1;display:inline-block}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#030304}
#bg{position:absolute;inset:0;background:radial-gradient(1100px 620px at 50% -8%,rgba(150,172,220,.075),rgba(0,0,0,0) 70%),radial-gradient(900px 500px at 50% 112%,rgba(255,255,255,.03),rgba(0,0,0,0) 70%)}
#dust,#sparks,#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#world{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 50%}
#cam{position:absolute;inset:0;transform-style:preserve-3d}
.abs{position:absolute}
.hid{visibility:hidden;opacity:0}

/* ---------- Téléphone : dalle de verre ---------- */
.phone{position:absolute;left:50%;top:50%;width:408px;height:862px;margin:-431px 0 0 -204px;transform-style:preserve-3d}
.phone .back{position:absolute;inset:0;border-radius:62px;transform:translateZ(-16px);background:linear-gradient(120deg,#5a5c62 0%,#1a1b1e 22%,#0c0c0d 50%,#1d1e21 78%,#6a6c72 100%);box-shadow:0 60px 120px rgba(0,0,0,.75)}
.phone .face{position:absolute;inset:0;border-radius:62px;background:#050505;overflow:hidden}
.phone .screen{position:absolute;left:9px;top:9px;width:390px;height:844px;border-radius:53px;overflow:hidden;background:#0a0a0a}
.phone .rim{position:absolute;inset:0;border-radius:62px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34),inset 0 0 0 3px rgba(0,0,0,.9),inset 0 0 0 9px #040404,inset 0 0 0 10px rgba(255,255,255,.07);pointer-events:none}
.phone .glare{position:absolute;inset:0;border-radius:62px;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.075) 44%,rgba(255,255,255,.015) 52%,rgba(255,255,255,0) 60%);background-size:260% 100%;background-position:50% 0}
.phone .topsheen{position:absolute;inset:0;border-radius:62px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 18%)}

/* ---------- Interface Reiz (valeurs de src/styles.ts) ---------- */
.scr{position:absolute;inset:0;background:#0a0a0a;overflow:hidden}
.sb{position:absolute;left:0;right:0;top:0;height:52px}
.sb .tm{position:absolute;left:44px;top:17px;font:600 17px/1 Inter;letter-spacing:-.2px}
.sb .ic{position:absolute;right:30px;top:19px;display:flex;gap:6px;align-items:center}
.hdr{position:absolute;left:16px;right:16px;top:56px;height:36px;display:flex;align-items:center;justify-content:space-between}
.hdr .lg{width:72px;height:auto;display:block}
.hdr .rt{display:flex;align-items:center;gap:14px}
.hdr .hrt{position:relative;font-size:25px;color:#fff}
.hdr .hbd{position:absolute;top:-4px;right:-7px;min-width:17px;height:17px;border-radius:9px;background:#ff3b30;border:1.5px solid #0a0a0a;font:800 10px/14px Inter;text-align:center;padding:0 3px;opacity:0}
.streak{display:flex;align-items:center;gap:4px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:20px;padding:6px 11px 6px 9px;font:700 13px/1 Inter}
.streak .ion{font-size:14px}
.body{position:absolute;left:0;right:0;top:102px;bottom:0;overflow:hidden}
.inner{position:absolute;left:0;right:0;top:0}
.stats{display:flex;gap:8px;margin:2px 16px 16px}
.stat{flex:1;background:#111;border-radius:20px;padding:14px 6px;text-align:center}
.stat b{display:block;font:900 20px/24px Inter}
.stat i{display:block;font:700 9px/11px Inter;font-style:normal;color:#888;text-transform:uppercase;margin-top:3px}
.oc{background:#111;border-radius:20px;padding:18px;margin:0 16px 12px}
.oc .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.oc .nm{flex:1;font:800 18px/22px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}
.vis{background:#1e1e1e;border-radius:20px;padding:4px 10px;font:700 10px/12px Inter;color:#888}
.oc .sub{font:400 12px/15px Inter;color:#888;margin-bottom:14px}
.oc .pr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.track{flex:1;height:4px;background:#222;border-radius:4px;position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:4px}
.glint{position:absolute;top:-2px;bottom:-2px;width:60px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(170,200,255,.9),rgba(255,255,255,0));opacity:0}
.oc .pct{font:800 13px/16px Inter;min-width:32px;text-align:right}
.ubtn{background:#fff;border-radius:14px;padding:12px;text-align:center;font:800 13px/16px Inter;color:#000}
.hint{font:400 11px/14px Inter;color:#666;text-align:center}
.nav{position:absolute;left:16px;right:16px;bottom:34px;height:64px;display:flex;align-items:center;gap:10px}
.npill{flex:1;height:64px;border-radius:36px;position:relative;display:flex;align-items:center;justify-content:space-around;padding:0 6px;background:linear-gradient(180deg,rgba(78,78,84,.62),rgba(40,40,44,.62));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.4)}
.npill .ion{font-size:22px;color:rgba(235,235,245,.62);width:48px;text-align:center;position:relative;z-index:2}
.npill .ion.on{color:#fff}
.nbub{position:absolute;top:8px;width:48px;height:48px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.3);z-index:1}
.nplus{width:56px;height:56px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(255,255,255,.18);flex:none}
.nplus .ion{font-size:30px;color:#000}

/* Écran Poster */
.phdr{position:absolute;left:16px;right:16px;top:56px;height:36px;display:flex;align-items:center;justify-content:space-between}
.bk{width:34px;height:34px;border-radius:17px;background:#1a1a1a;border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;color:#888;font-size:20px}
.phdr .tt{font:800 17px/1 Inter}
.pz{height:280px;background:#111;position:relative;overflow:hidden}
.pz .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.pz .chg{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);border-radius:20px;padding:6px 12px;font:700 12px/15px Inter}
.pb{padding:24px 20px 0}
.pl{font:700 10px/12px Inter;color:#888;letter-spacing:1.5px;margin-bottom:12px}
.pl.m{margin-top:28px}
.ocs{display:flex;gap:10px;margin:0 -20px;padding:0 20px;overflow:hidden}
.poc{width:120px;flex:none;background:#111;border-radius:16px;padding:14px;border:1.5px solid #1e1e1e}
.poc.on{border-color:#fff;background:#1a1a1a}
.poc .e{font-size:22px;line-height:26px;margin-bottom:8px}
.poc .t{font:600 12px/16px Inter;color:#999;height:32px;overflow:hidden}
.poc.on .t{color:#fff}
.avs{display:flex;gap:14px;margin:0 -20px;padding:0 20px;overflow:hidden}
.av60{width:60px;flex:none;text-align:center}
.ring{width:52px;height:52px;border-radius:26px;border:2px solid rgba(255,255,255,0);padding:2px;position:relative;margin:0 auto}
.ring .in{width:100%;height:100%;border-radius:24px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font:700 16px/1 Inter}
.ring .ck{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:9px;background:#fff;color:#000;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0}
.av60 .n{font:600 11px/14px Inter;color:#888;margin-top:5px}
.pw{display:flex;align-items:center;gap:16px;background:#111;border-radius:20px;padding:16px}
.pbtn{width:44px;height:44px;border-radius:22px;background:#1e1e1e;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pc{flex:1;text-align:center}
.pc .big{font:900 32px/39px Inter;letter-spacing:-1px;height:39px;position:relative;overflow:hidden}
.pc .big .u{font:700 16px/1 Inter;color:#888;letter-spacing:0}
.pc .val{font:400 12px/15px Inter;color:#888;margin-top:4px}
.pc .bar{height:4px;background:#222;border-radius:2px;margin-top:12px;position:relative;overflow:hidden}
.cap-in{background:#111;border-radius:16px;padding:14px;min-height:80px;font:400 14px/20px Inter;color:#fff}
.cap-in .ph2{color:#666}
.caret{display:inline-block;width:2px;height:18px;background:#0a84ff;vertical-align:-3px;margin-left:1px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 34px;background:#0a0a0a}
.cta .b{background:#fff;border-radius:18px;padding:16px;text-align:center;font:800 16px/20px Inter;color:#000}
.toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:22px;padding:10px 16px;font:700 13px/16px Inter;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0}
.toast .ok{width:18px;height:18px;border-radius:9px;background:#fff;color:#000;font-size:12px;display:flex;align-items:center;justify-content:center}
.morph{position:absolute;background:#fff;opacity:0}

/* Fil */
.fc{background:#111;border-radius:20px;margin:0 16px 16px;overflow:hidden;position:relative}
.fph{position:relative;height:360px;background:#141414}
.fph .img{position:absolute;inset:0;background-size:cover;background-position:center}
.ovt{position:absolute;left:0;right:0;top:0;padding-bottom:40px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0))}
.ovh{display:flex;align-items:center;gap:10px;padding:14px}
.av{width:40px;height:40px;border-radius:20px;border:1.5px solid #333;background:#2a2a2a center/cover;display:flex;align-items:center;justify-content:center;font:800 14px/1 Inter;flex:none}
.meta{flex:1}
.meta .n{font:700 14px/17px Inter}
.meta .d{font:600 12px/15px Inter;color:rgba(255,255,255,.9);margin-top:1px}
.meta .w{font:400 11px/14px Inter;color:rgba(255,255,255,.6);margin-top:1px}
.dots{font-size:18px;color:rgba(255,255,255,.7)}
.ovb{position:absolute;left:0;right:0;bottom:0;padding-top:60px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85))}
.fpr{display:flex;align-items:center;gap:10px;padding:0 14px 8px}
.fpr .bg{flex:1;height:2px;background:rgba(255,255,255,.15);border-radius:2px;position:relative}
.fpr .fl{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.fpr .lb{font:800 11px/14px Inter;color:rgba(255,255,255,.7)}
.fcap{font:400 13px/18px Inter;color:rgba(255,255,255,.85);padding:0 14px 6px}
.rxs{display:flex;padding:0 14px 6px;min-height:0}
.rx{display:flex;align-items:center;gap:4px;background:#1c1c1c;border-radius:20px;padding:5px 10px;margin-right:6px;margin-bottom:8px;overflow:hidden}
.rx.me{background:#2a2a2a}
.rx .e{font-size:14px;line-height:17px}
.rx .c{font:700 12px/15px Inter;color:#888}
.acts{display:flex;align-items:center;gap:7px;padding:4px 14px 14px}
.act{display:flex;align-items:center;gap:6px;background:#1c1c1c;border-radius:22px;padding:8px 12px;font:600 13px/16px Inter;color:#888;white-space:nowrap}
.act .ion{font-size:16px;color:#888}
.act.duo{background:#fff;color:#000;font-weight:700}
.fnp{padding:16px 16px 8px}
.fnp .ch{display:flex;align-items:center;gap:10px}
.fnp .cp{font:600 16px/22px Inter;margin:10px 0 14px}
.fnp .prw{display:flex;align-items:center;gap:10px;padding:10px 0}
.fnp .prw .bg{flex:1;height:2px;background:rgba(255,255,255,.15);border-radius:2px;position:relative}
.fnp .prw .lb{font:700 11px/14px Inter;color:#999}
.femo{position:absolute;font-size:30px;line-height:1;opacity:0;z-index:5;pointer-events:none}

/* Profil */
.ptb{display:flex;justify-content:flex-end;padding:4px 16px 0;height:36px}
.ptb .ion{font-size:23px;color:#fff;padding:6px}
.hero{text-align:center;padding:24px 0;margin-bottom:8px}
.pav{width:88px;height:88px;border-radius:44px;margin:0 auto 12px;position:relative;background:#222 center/cover}
.pav .cm{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:14px;background:#1a1a1a;border:2px solid #0a0a0a;display:flex;align-items:center;justify-content:center;font-size:13px}
.hero .nm{font:900 22px/27px Inter;letter-spacing:-.5px}
.hero .hi{font:400 11px/14px Inter;color:#888;margin-top:4px}
.hero .us{font:400 13px/16px Inter;color:#888;margin-top:4px}
.hero .bio{font:400 14px/20px Inter;color:#ddd;margin-top:8px}
.hero .mb{font:400 11px/14px Inter;color:#666;margin-top:4px}
.stt{font:700 11px/13px Inter;color:#777;text-transform:uppercase;letter-spacing:1.5px;margin:22px 16px 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.tag{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:18px;background:#161616;border:1px solid #262626;font:600 13px/16px Inter;color:#eee}
.tag .e{font-size:14px}
.tag .k{font:700 12px/15px Inter;color:#888}
.bstrip{display:flex;gap:12px;padding:0 16px;overflow:hidden}
.bi{width:68px;flex:none;text-align:center}
.bi .c{width:56px;height:56px;border-radius:28px;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative}
.bi .c img{width:62px;height:62px;display:block}
.bi .t{font:700 10px/12px Inter;color:#ddd;margin-top:6px}
.bi.off{opacity:.35}
.bi.off .c{background:#111;border:1.5px solid #1c1c1c}
.ocp{background:#111;border-radius:20px;padding:16px;margin:0 16px 10px}
.ocp .h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ocp .h .t{flex:1;font:700 15px/18px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocp .h .p{font:900 15px/18px Inter}
.ocp .h .ion{font-size:18px;color:#777}
.ocp .bgl{height:2px;background:rgba(255,255,255,.15);border-radius:2px;position:relative;margin-bottom:10px}
.ocp .bgl .fl{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
.heat{display:flex;flex-wrap:wrap;gap:3px}
.heat i{width:12px;height:12px;border-radius:2px;background:#1e1e1e;display:block}
.ocp .ft{font:600 11px/14px Inter;color:#888;text-align:right;margin-top:8px}

/* ---------- Titres du film ---------- */
.capt{position:absolute;left:150px;top:540px;width:560px;transform:translateY(-50%)}
.capt .t{font:800 66px/1.02 Inter;letter-spacing:-2.4px;color:#fff}
.capt .s{font:500 25px/1.35 Inter;color:#A4A4AC;margin-top:18px;letter-spacing:-.2px}
.w{display:inline-block;will-change:transform,opacity,filter}
#capLine{position:absolute;left:0;right:0;top:902px;text-align:center;font:800 50px/1 Inter;letter-spacing:-1.8px;white-space:nowrap}
#capLine span{display:inline-block;margin:0 10px}
.logo{position:absolute;left:50%;top:0;width:560px;height:198px;margin-left:-280px;-webkit-mask:url(assets/ecriture-reiz-blanc-trim.png) center/contain no-repeat;mask:url(assets/ecriture-reiz-blanc-trim.png) center/contain no-repeat;background-image:linear-gradient(104deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 44%,rgba(255,255,255,1) 50%,rgba(255,255,255,0) 56%,rgba(255,255,255,0) 100%),linear-gradient(180deg,#FFFFFF 0%,#E4E6EB 40%,#9CA0A9 100%);background-size:300% 100%,100% 100%;background-repeat:no-repeat}
.lglow{position:absolute;left:50%;width:900px;height:420px;margin-left:-450px;border-radius:50%;background:radial-gradient(closest-side,rgba(200,212,240,.13),rgba(0,0,0,0));pointer-events:none}
.dotglow{position:absolute;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(220,230,255,.35) 35%,rgba(0,0,0,0));opacity:0;pointer-events:none}
.line{position:absolute;left:50%;height:2px;width:600px;margin-left:-300px;background:rgba(255,255,255,.1);border-radius:2px}
.line i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;border-radius:2px;transform-origin:0 50%;box-shadow:0 0 14px rgba(255,255,255,.6),0 0 3px #fff}
.tagw{position:absolute;left:0;right:0;text-align:center;font:500 22px/1 Inter;letter-spacing:.52em;text-transform:uppercase;color:#BDBDC4;white-space:nowrap}
.tagw span{display:inline-block;margin:0 .1em}
.notif{position:absolute;left:0;top:0;width:600px;display:grid;grid-template-columns:auto 1fr;gap:3px 16px;padding:20px 22px 22px;border-radius:34px;background:rgba(58,58,64,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.6);backdrop-filter:blur(26px) saturate(1.6);-webkit-backdrop-filter:blur(26px) saturate(1.6)}
.notif .ico{grid-row:span 3;width:52px;height:52px;border-radius:13px;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
.notif .ico img{width:40px;height:auto}
.notif .ap{display:flex;justify-content:space-between;font:500 16px/20px Inter;color:rgba(235,235,245,.66);text-transform:uppercase;letter-spacing:.3px}
.notif .ti{font:700 21px/27px Inter;color:#fff}
.notif .bo{font:400 20px/27px Inter;color:#EDEDF1}
.badge3{position:absolute;left:0;top:0;transform-style:preserve-3d}
.badge3 img,.badge3 .sh{position:absolute;inset:0;width:100%;height:100%}
.badge3 .sh{-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 42%,rgba(255,255,255,.8) 50%,rgba(255,255,255,0) 58%,rgba(255,255,255,0) 100%);background-size:320% 100%;background-position:130% 0;mix-blend-mode:screen}
.edge{position:absolute;left:50%;top:10%;width:30px;height:80%;margin-left:-15px;border-radius:14px;transform:rotateY(90deg);box-shadow:0 0 18px rgba(255,255,255,.25)}
.bglow{position:absolute;border-radius:50%;pointer-events:none}
.tick{position:absolute;text-align:center;font:500 16px/1 Inter;color:#6E6E76}
.tick img{display:block;width:70px;height:70px;margin:0 auto 10px}
.flamepill{position:absolute;display:flex;align-items:center;gap:8px;background:#1e1e1e;border:1.5px solid #2a2a2a;border-radius:40px;padding:12px 22px 12px 18px;font:700 28px/1 Inter;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.flamepill .ion{font-size:28px}
.cellp{position:absolute;width:28px;height:28px;border-radius:5px;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.7)}
.flyer{position:absolute;left:0;top:0;width:358px;height:250px;border-radius:20px;overflow:hidden;background:#141414 center/cover;box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.16)}
.flyer::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%)}
#endTxt{position:absolute;left:0;right:0;text-align:center;font:600 40px/1 Inter;letter-spacing:-1px;white-space:nowrap}
#soon{position:absolute;left:0;right:0;text-align:center;font:500 18px/1 Inter;letter-spacing:.42em;text-transform:uppercase;color:#8E8E96}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#black{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>

      const at = 25.25 + 2.1 * Math.pow(k / (ACTIVE.length - 1), .62);
      const on = t >= at; if (on) lit++;
      const c = cells[ci]; const g = clamp(P(t, at, at + .25));
      c.style.background = on ? '#fff' : '#1e1e1e';
      c.style.boxShadow = on ? `0 0 ${(10 * (1 - g) + 2).toFixed(1)}px rgba(255,255,255,${(.9 * (1 - g) + .2).toFixed(2)})` : 'none';
    });
    setNum('pl-ft', `${lit} jours sur les 30 derniers`);
    // flamme de série
    const fs = spring(t, 26.0, .6);
    const [fx, fy] = toStage({ x: 190, y: P7Y(s), s }, G.ocp.x + G.ocp.w, G.ocp.y - SCR7);
    vis(flame, clamp(fs) * (1 - out)); flame.style.transform = `translate(${fx - 120}px,${lerp(fy - 40, fy - 78, clamp(fs))}px) scale(${lerp(.9, 1, clamp(fs))})`;
    setNum('flN', Math.round(lerp(1, 12, E.outCubic(P(t, 26.0, 27.2)))) + 'j');
  } else {
    vis(flame, 0);
    // hors plan 7 : grille à l'état final (18 jours)
    if (t >= 28.6 || t < 24.8) PH.pLow.querySelectorAll('#pl-heat i').forEach((c, i) => { c.style.background = ACTIVE.includes(i) ? '#fff' : '#1e1e1e'; c.style.boxShadow = 'none'; });
  }
  // cristallisation : les cases allumées se contractent en un point
  {
    const a = P(t, 28.0, 28.55);
    if (a > 0 && a < 1) {
      const s = 2.25, pose = { x: 190, y: P7Y(s), s };
      ACTIVE.forEach((ci, k) => {
        const c = G.cells[ci];
        const [X, Y] = toStage(pose, c.x + 6, c.y - SCR7 + 6);
        const kk = E.inExpo(clamp(a * 1.15 - k * .004));
        const px = lerp(X, 960, kk), py = lerp(Y, 470, kk);
        cellPs[k].style.transform = `translate(${px - 14}px,${py - 14}px) scale(${lerp(1, .15, kk)})`;
        vis(cellPs[k], (a < .02 ? a * 50 : 1) * (1 - P(a, .9, 1)));
      });
    } else cellPs.forEach(c => vis(c, 0));
  }

  /* ---------------- PLAN 8 : la collection ---------------- */
  const flare = Math.max(0, Math.sin(Math.PI * P(t, 28.45, 29.1)));
  {
    const on = t > 28.6 && t < 31.6;
    const cols = [860, 1095, 1330, 1565], rows = [300, 540, 780];
    coll.forEach((b, i) => {
      if (!on) { vis(b, 0); return; }
      const r = Math.floor(i / 4), c = i % 4;
      const d = (i * 7 % 12) / 12;                          // ordre d'apparition
      const e = E.outExpo(P(t, 28.75 + d * .45, 28.75 + d * .45 + 1.1));
      const X = lerp(960, cols[c], e), Y = lerp(470, rows[r], e);
      const Z = [-140, -30, -30, -140][c];
      const ry = [22, 8, -8, -22][c] + 12 * Math.sin(t * .9 + i);
      const isPP = i === 0;
      // travelling avant vers Premier pas
      const dolly = E.inOutCubic(P(t, 30.75, 31.45));
      let x = X, y = Y, z = Z, s = lerp(.2, 1, e), o = e;
      if (isPP) { x = lerp(X, 1040, dolly); y = lerp(Y, 470, dolly); z = lerp(Z, 0, dolly); s *= lerp(1, 440 / 210, dolly); o *= 1 - P(t, 31.2, 31.35); }
      else { z = Z - 600 * dolly; o *= 1 - dolly; }
      b.style.transform = `translate3d(${x - 960}px,${y - 540}px,${z}px) rotateY(${ry * (isPP ? 1 - dolly : 1)}deg) scale(${s})`;
      b.style.left = '855px'; b.style.top = '435px';
      b.style.filter = `blur(${((1 - e) * 12 + (isPP ? 0 : dolly * 8) + (c === 0 || c === 3 ? 1.2 : 0)).toFixed(2)}px) brightness(${(1 + flare * .3).toFixed(2)})`;
      vis(b, o);
      // faisceau qui balaie la collection
      const tb = 29.35 + (cols[c] - 800) / 860 * 1.15 + r * .06;
      b.querySelector('.sh').style.backgroundPosition = `${lerp(130, -30, clamp(P(t, tb - .35, tb + .35))).toFixed(1)}% 0`;
    });
  }

  /* ---------------- PLAN 9 : montée de niveau ---------------- */
  const LT = [31.25, 32.5, 33.75, 34.375, 35.0, 35.625], H = .26;
  if (t > 31.1 && t < 37.9) {
    let show = 0, ang = 9 * Math.sin((t - 31.25) * 1.15);
    for (let k = 0; k < 6; k++) if (t >= LT[k]) show = k;
    for (let k = 1; k < 6; k++) {
      const d = t - LT[k];
      if (d > -H && d < H) { const u = (d + H) / (2 * H); if (u < .5) { ang = ang * (1 - u * 2) + 90 * E.inOutSine(u * 2); show = k - 1; } else { ang = -90 + 90 * E.outCubic((u - .5) * 2); show = k; } }
    }
    if (t < LT[1] - H) show = 0;
    const src = `assets/pp${show + 1}.png`;
    if (heroImg.getAttribute('src') !== src) { heroImg.setAttribute('src', src); heroSh.style.webkitMaskImage = heroSh.style.maskImage = `url(${src})`; }
    heroEdge.style.background = `linear-gradient(180deg,rgba(255,255,255,0),${LV[show].e} 22%,#fff 50%,${LV[show].e} 78%,rgba(255,255,255,0))`;
    // arrivée (depuis la collection) et départ vers le profil
    const inn = E.outCubic(P(t, 31.2, 31.5));
    const leave = E.inOutCubic(P(t, 37.05, 37.75));
    const lx = 1040, ly = 470;
    const [tx, ty] = toStage({ x: 190, y: -10, s: PS }, G.b0.x + G.b0.w / 2, G.b0.y + G.b0.h / 2);
    const x = lerp(lx, tx, leave), y = lerp(ly, ty, leave) - Math.sin(Math.PI * leave) * 60;
    const sc = lerp(1, 62 * PS / 440, leave);
    hero.style.left = (960 - 220) + 'px'; hero.style.top = (540 - 220) + 'px';
    hero.style.transform = `translate3d(${x - 960}px,${y - 540}px,0) rotateY(${(ang * (1 - leave)).toFixed(2)}deg) scale(${sc})`;
    vis(hero, inn * (1 - P(t, 37.7, 37.8)));
    {
      const ar = ang * Math.PI / 180, sn = Math.abs(Math.sin(ar)), co = Math.cos(ar);
      const w = 34 * sn * sc, h = 440 * .76 * sc, off = Math.sign(ang || 1) * 200 * sc * co * .85;
      heroEdge.style.width = w + 'px'; heroEdge.style.height = h + 'px';
      heroEdge.style.transform = `translate(${x + off - w / 2}px,${y - h / 2}px)`;
      heroEdge.style.boxShadow = `0 0 ${24 * sc}px ${LV[show].g}`;
      vis(heroEdge, clamp((sn - .6) / .3) * inn * (1 - leave));
    }
    // reflet après chaque changement, contre-jour au niveau 6
    const last = LT[show]; const sp = P(t, last + .02, last + .9);
    const sp6 = P(t, 36.05, 36.95);
    const shPos = show === 5 && t > 36 ? lerp(130, -30, E.inOutSine(sp6)) : lerp(130, -30, E.inOutSine(sp));
    heroSh.style.backgroundPosition = `${shPos.toFixed(1)}% 0`;
    const back6 = show === 5 ? Math.sin(Math.PI * P(t, 35.6, 36.4)) : 0;
    heroImg.style.filter = `brightness(${(1 + back6 * .15).toFixed(3)}) drop-shadow(0 0 ${(20 + back6 * 40).toFixed(0)}px ${LV[show].g})`;
    // halo derrière le badge
    const gs = 560 + show * 60 + back6 * 180;
    heroGlow.style.width = heroGlow.style.height = gs + 'px';
    heroGlow.style.left = (x - gs / 2) + 'px'; heroGlow.style.top = (y - gs / 2) + 'px';
    heroGlow.style.background = `radial-gradient(closest-side,${LV[show].g},rgba(0,0,0,0))`;
    vis(heroGlow, inn * (1 - leave));
    // étincelles aux niveaux 5 et 6
    const amt = (show >= 4 ? (show === 5 ? 1 : .45) : 0) * (1 - leave);
    drawSparks(t, x, y, 300, amt, show === 5 ? '255,196,120' : '205,160,255');
    // repères de niveau
    ticks.forEach((tk, k) => {
      const o = E.outCubic(P(t, 31.6 + k * .05, 32.1 + k * .05)) * (1 - E.inCubic(P(t, 36.9, 37.3)));
      vis(tk, o);
      tk.style.transform = `translate(${1040 - 5 * 50 + k * 100 - 45}px,800px)`;
      const cur = k === show, done = k <= show;
      tk.style.color = cur ? (k === 5 ? '#F2B660' : '#fff') : done ? '#8a8a92' : '#4a4a50';
      tk.querySelector('img').style.opacity = cur ? 1 : done ? .7 : .28;
      tk.querySelector('img').style.filter = cur ? `drop-shadow(0 0 12px ${LV[k].g})` : 'none';
      tk.querySelector('img').style.transform = `scale(${cur ? 1.12 : 1})`;
    });
  } else { vis(hero, 0); vis(heroGlow, 0); vis(heroEdge, 0); ticks.forEach(k => vis(k, 0)); drawSparks(t, 0, 0, 0, 0, '0,0,0'); }

  /* ---------------- PLAN 10 : profil ---------------- */
  if (t > 37.0 && t < 40.9) {
    const inn = E.outCubic(P(t, 37.1, 37.8));
    const out = E.inOutCubic(P(t, 39.85, 40.7));
    place(PH.pTop, { x: 190, y: -10, z: lerp(-200, 0, inn) - 700 * out, ry: lerp(-12, -3, E.inOutSine(P(t, 37.1, 40))), s: PS, op: inn * (1 - out), blur: out * 6 });
    setScroll('pt', 0);
    const b0 = document.getElementById('pt-b0'); b0.style.opacity = t < 37.72 ? 0 : 1;
    b0.style.transform = `scale(${1 + .12 * Math.sin(Math.PI * P(t, 37.72, 38.05))})`;
    const k = E.outCubic(P(t, 37.8, 38.7));
    setNum('pt-s1', Math.round(12 * k) + 'j'); setNum('pt-s2', String(Math.round(48 * k))); setNum('pt-s3', String(Math.round(10 * k)));
    setNum('pt-tk', t >= 38.6 ? '+4' : '+3');
    const tk = document.getElementById('pt-tk'); tk.style.color = t >= 38.6 ? '#fff' : '#888';
    tk.parentElement.style.transform = `scale(${1 + .06 * Math.sin(Math.PI * P(t, 38.6, 38.9))})`;
  }

  /* ---------------- PLAN 11 : tout revient autour du logo ---------------- */
  if (t > 40.1) {
    const a = E.outCubic(P(t, 40.1, 40.9)), rec = E.inCubic(P(t, 40.9, 41.7));
    const orbit = (t - 40.1) * 9;
    const items = [[PH.obj, 0], [PH.post, 90], [PH.fil, 180], [PH.pLow, 270]];
    canonical();
    if (t < 41.8) items.forEach(([p, base]) => {
      const ang = (base + orbit + 45) * Math.PI / 180;
      const x = Math.cos(ang) * 720, y = Math.sin(ang) * 300, z = -420 - 1500 * rec;
      place(p, { x, y: y - 20, z, ry: -Math.cos(ang) * 26, rx: Math.sin(ang) * 8, s: .56, op: a * (1 - rec), blur: 1.5 + rec * 8, br: .72 });
    });
    orbB.forEach((b, i) => {
      const ang = (i * 90 + orbit + 0) * Math.PI / 180;
      const x = Math.cos(ang) * 560, y = Math.sin(ang) * 330, z = -300 - 1300 * rec;
      b.style.left = '885px'; b.style.top = '465px'; b.style.width = b.style.height = '150px';
      b.style.transform = `translate3d(${x}px,${y - 60}px,${z}px) rotateY(${Math.sin(t + i) * 20}deg)`;
      b.style.filter = `blur(${(1.5 + rec * 6).toFixed(1)}px)`;
      vis(b, E.outCubic(P(t, 40.0 + i * .1, 40.7 + i * .1)) * (1 - rec) * .85);
    });
  } else orbB.forEach(b => vis(b, 0));

  /* ---------------- Fond, poussières, grain ---------------- */
  const dustAmt = t < 9 ? E.outCubic(P(t, .2, 2)) * (1 - P(t, 7, 9)) * .9 : t > 39.5 ? E.outCubic(P(t, 39.5, 41)) * .9 * (1 - E.inOutSine(P(t, 43.9, 44.6))) : .22;
  drawDust(t, dustAmt);
  // petite montée de lumière à l'impact des badges, jamais de flash blanc
  $('#bg').style.filter = flare > 0.01 ? `brightness(${1 + flare * 1.5})` : 'none';
  renderCaption(t);
  drawGrain(f);
  vis($('#black'), t < .35 ? 1 - t / .35 : 0);
}

/* ---------- aides ---------- */
// position d'un élément dans l'écran du téléphone (390 × 844), hors défilement
function geo(id) { let e = document.getElementById(id); const w = e.offsetWidth, h = e.offsetHeight; let x = 0, y = 0; while (e && !e.classList.contains('scr')) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y, w, h }; }
// point de l'écran → point de la scène, pour un téléphone posé de face
const toStage = (pose, sx, sy) => [960 + pose.x + (sx - 195) * pose.s, 540 + pose.y + (sy - 422) * pose.s];
let G = null;
const SCR7 = 470;
const P7Y = (s) => 520 - 540 - (G.ocp.y - SCR7 + G.ocp.h / 2 - 422) * s;
function measure() {
  G = {
    ubtn: geo('o-u0'), card0: geo('o-c0'),
    photo: { x: 0, y: 102, w: 390, h: 280 },
    fcard: geo('f-card'), duo: (() => { const d = document.getElementById('f-duo'); d.style.display = 'flex'; const g = geo('f-duo'); d.style.display = 'none'; return g; })(),
    ocp: geo('pl-ocp'), cells: [...document.querySelectorAll('#pl-heat i')].map(c => { let x = 0, y = 0, e = c; while (e && !e.classList.contains('scr')) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y }; }),
    bar: (() => { const b = document.querySelector('#pl-ocp .bgl'); let x = 0, y = 0, e = b; while (e && !e.classList.contains('scr')) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return { x, y, w: b.offsetWidth }; })(),
    b0: geo('pt-b0'),
  };
}
function setScroll(id, y) { const e = document.getElementById(id + '-in'); if (e) e.style.transform = `translateY(${-y}px)`; }
function setScrollEl(id, y) { const e = document.getElementById(id); if (e) e.style.transform = `translateY(${-y}px)`; }
function canonical() {
  resetObjForOrbit();
  setScrollEl('q-in', 0); document.getElementById('q-mo').style.opacity = 0; document.getElementById('q-toast').style.opacity = 0;
  PH.fil.querySelector('.screen').style.filter = 'none'; setScroll('pl', SCR7);
}
function resetObjForOrbit() {
  OBJ.forEach((o, i) => { document.getElementById('o-f' + i).style.width = o.pct + '%'; });
  $('#o-dofT').style.opacity = 0; $('#o-dofB').style.opacity = 0;
}
// émojis flottants du plan 5 (même animation que FloatingEmoji dans l'app)
const FLO = (() => { const r = rng(55); const L = []; [[19.45, '🔥'], [19.75, '💪'], [20.05, '🔥'], [20.25, '👏'], [20.5, '🔥'], [20.6, '💪'], [20.85, '🙌']].forEach(([a, e]) => L.push({ a, e, dx: (r() - .5) * 60, sw: 10 + r() * 16, ph: r() * 6 })); return L; })();
const floEls = FLO.map(fl => add(`<div class="femo">${fl.e}</div>`));
function renderFloats(t) {
  FLO.forEach((fl, i) => {
    const e = floEls[i]; const k = P(t, fl.a, fl.a + 1.25);
    if (k <= 0 || k >= 1 || t > 22.5) { vis(e, 0); return; }
    const x = 1150 - 105 + fl.dx + Math.sin(k * 6 + fl.ph) * fl.sw, y = 540 + 100 - k * 330;
    e.style.transform = `translate(${x}px,${y}px) scale(${.7 + E.outCubic(clamp(k * 3)) * .5})`;
    vis(e, Math.min(clamp(k * 6), 1 - E.inCubic(P(k, .55, 1))));
  });
}

/* ---------- prêt ---------- */

window.__ready = false;
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => { }))]).then(() => {
  const qs = new URLSearchParams(location.search);
  measure();
  render(parseFloat(qs.get('t') || '0'));
  window.__ready = true;
});
</script>
