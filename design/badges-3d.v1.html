<title>Badges Reiz 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --card: #141417;
    --line: #222228;
    --text: #f3f3f5;
    --muted: #a3a3ad;
    --faint: #8b8b95;
    --accent: #ffffff;
  }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #gl {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2; display: block;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }
  .top {
    display: flex; flex-wrap: wrap; gap: 20px 40px;
    align-items: flex-end; justify-content: space-between; margin-bottom: 26px;
  }
  .brand { display: flex; gap: 22px; align-items: center; }
  .logo { font-weight: 800; font-size: 42px; letter-spacing: -0.045em; line-height: 1; }
  .kicker { font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #d6d6dc; }
  .sub { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 7px; }
  .lvbox { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .lvrow { display: flex; align-items: center; gap: 12px; }
  .lvlabel { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .seg button {
    font: 700 14px/1 Inter, system-ui, sans-serif; color: var(--muted);
    width: 38px; height: 34px; border-radius: 8px; border: 0; background: transparent; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .seg button[aria-checked="true"] { background: #f3f3f5; color: #0a0a0b; }
  .seg button:focus-visible { outline: 2px solid #f3f3f5; outline-offset: 2px; }
  .seg button.anim::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: currentColor; margin: 3px auto 0; opacity: .55; }
  .lvnote { margin: 0; font-size: 13px; color: var(--muted); text-align: right; max-width: 40ch; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1020px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 720px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .lvbox { align-items: flex-start; }
    .lvnote { text-align: left; }
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .stage {
    width: 100%; aspect-ratio: 1 / 1; max-width: 100%; margin-bottom: 6px;
    touch-action: pan-y; cursor: grab; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--faint); font-size: 12px; text-align: center;
  }
  .stage:active { cursor: grabbing; }
  .name { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; text-wrap: balance; }
  .desc { font-size: 13px; line-height: 1.45; color: var(--muted); }
  .motion { font-size: 11px; line-height: 1.4; letter-spacing: 0.06em; color: var(--faint); margin-top: 4px; }
  .motion b { font-weight: 700; color: #b9b9c2; letter-spacing: 0.14em; text-transform: uppercase; font-size: 10px; margin-right: 6px; }
  @media (max-width: 430px) {
    .card { padding: 12px; }
    .name { font-size: 15px; }
    .desc { font-size: 12px; }
    .logo { font-size: 34px; }
  }
  .foot { margin-top: 22px; font-size: 13px; color: var(--faint); }
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="logo">Reiz.</span>
      <div>
        <div class="kicker">Badges animés en 3D</div>
        <div class="sub">12 badges, animés dès le niveau 4</div>
      </div>
    </div>
    <div class="lvbox">
      <div class="lvrow">
        <span class="lvlabel" id="lvlabel">Niveau</span>
        <div class="seg" id="seg" role="radiogroup" aria-labelledby="lvlabel"></div>
      </div>
      <p class="lvnote" id="lvnote"></p>
    </div>
  </header>
  <main class="grid" id="grid"></main>
  <p class="foot">Glisse un badge pour le faire tourner. Rendu 3D en temps réel : la même scène pourra tourner dans l’app.</p>
</div>

<script>
  // Données des badges, rendues tout de suite en HTML (le texte reste lisible même sans 3D).
  window.BADGE_DATA = [
    { name: "Premier pas", desc: "Ta première séance. Le début d’une grande progression.", motion: "Les pas avancent et s’impriment." },
    { name: "En action", desc: "Tu passes régulièrement à l’action.", motion: "Le coureur court en boucle." },
    { name: "En duo", desc: "Tu t’entraînes avec quelqu’un.", motion: "Les deux silhouettes sautent à tour de rôle." },
    { name: "En feu", desc: "Tu enchaînes les séances sans interruption.", motion: "La flamme ondule, les braises montent." },
    { name: "Semaine parfaite", desc: "Tu atteins tous tes objectifs de la semaine.", motion: "Les 7 jours s’allument, puis la coche se trace." },
    { name: "Objectif atteint", desc: "Tu complètes un de tes objectifs personnels.", motion: "La flèche part et se plante au centre." },
    { name: "Régulier", desc: "Tu restes constant sur la durée.", motion: "Les flèches font un demi-tour, en rythme." },
    { name: "Binôme", desc: "Tu construis une relation sportive durable avec la même personne.", motion: "Les deux maillons tournent, toujours liés." },
    { name: "Lève-tôt", desc: "Tu t’entraînes tôt le matin.", motion: "Le soleil se lève au-dessus de l’horizon." },
    { name: "Couche-tard", desc: "Tu t’entraînes tard le soir.", motion: "La lune se balance, l’étoile scintille." },
    { name: "Inarrêtable", desc: "Tu maintiens une série exceptionnelle.", motion: "L’éclair crépite par salves." },
    { name: "Acharné", desc: "Tu fournis un volume d’effort important.", motion: "L’haltère monte et redescend, une répétition à la fois." }
  ];
  (function () {
    var grid = document.getElementById('grid');
    window.BADGE_DATA.forEach(function (b, i) {
      var card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = '<div class="stage" data-i="' + i + '" role="img" aria-label="Badge ' + b.name + ' en 3D"></div>' +
        '<div class="name">' + b.name + '</div><div class="desc">' + b.desc + '</div>' +
        '<div class="motion"><b>Animation</b>' + b.motion + '</div>';
      grid.appendChild(card);
    });
  })();
</script>

<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  } }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ------------------------------------------------------------------
// Réglages
// ------------------------------------------------------------------
const ANIM_FROM = 4;                // niveau à partir duquel le badge s'anime
const qs = new URLSearchParams(location.search);
const FIXED_T = qs.has('t') ? parseFloat(qs.get('t')) : null;   // capture figée (tests)
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const V2 = THREE.Vector2, V3 = THREE.Vector3;
const WHITE = new THREE.Color(1, 1, 1);
const GREY = new THREE.Color('#80858f');
const CARD = new THREE.Color('#141417');

const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hash = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// Couleur d'un badge selon le niveau : gris au niveau 1, pleine couleur dès le 4.
function tint(hex, lv) {
  const c = new THREE.Color(hex);
  c.lerp(GREY, [0, 0.95, 0.62, 0.3, 0, 0, 0][lv]);
  if (lv === 1) c.multiplyScalar(0.75);
  return c;
}

// ------------------------------------------------------------------
// Rendu : un seul canvas, une fenêtre (viewport) par carte
// ------------------------------------------------------------------
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  document.querySelectorAll('.stage').forEach(s => { s.textContent = 'La 3D n’est pas disponible sur cet appareil.'; });
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function makeGlowTex(size, power) {
  const d = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = (x + 0.5) / size * 2 - 1, dy = (y + 0.5) / size * 2 - 1;
    const a = Math.pow(Math.max(0, 1 - Math.hypot(dx, dy)), power);
    const i = (y * size + x) * 4; d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = Math.round(a * 255);
  }
  const t = new THREE.DataTexture(d, size, size);
  t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
const GLOW = makeGlowTex(64, 2.2);
const DOT = makeGlowTex(32, 1.6);

// ------------------------------------------------------------------
// Formes 2D
// ------------------------------------------------------------------
function roundedPath(pts, rad) {
  const s = new THREE.Shape(), n = pts.length;
  for (let i = 0; i < n; i++) {
    const p = pts[i], prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n];
    const a = p.clone().add(prev.clone().sub(p).normalize().multiplyScalar(rad));
    const b = p.clone().add(next.clone().sub(p).normalize().multiplyScalar(rad));
    if (i === 0) s.moveTo(a.x, a.y); else s.lineTo(a.x, a.y);
    s.quadraticCurveTo(p.x, p.y, b.x, b.y);
  }
  s.closePath();
  return s;
}
const polyPts = (n, r, rot) => [...Array(n)].map((_, i) => { const a = rot + i * TAU / n; return new V2(Math.cos(a) * r, Math.sin(a) * r); });
const circleShape = (x, y, r) => { const s = new THREE.Shape(); s.absarc(x, y, r, 0, TAU, false); return s; };
const ellipseShape = (x, y, rx, ry) => { const s = new THREE.Shape(); s.absellipse(x, y, rx, ry, 0, TAU, false, 0); return s; };
function roundRect(x, y, w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function starShape(n, R, r) {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const a = Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R; p.push(new V2(Math.cos(a) * rr, Math.sin(a) * rr)); }
  return roundedPath(p, 0.012);
}
function arcPts(cx, cy, r, a0, a1, n) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push(new V2(cx + r * Math.cos(a), cy + r * Math.sin(a))); }
  return p;
}
// Croissant = disque (0,0,R) moins disque (cx,cy,r2)
function crescent(R, cx, cy, r2) {
  const d = Math.hypot(cx, cy), a = (R * R - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(R * R - a * a);
  const px = a * cx / d, py = a * cy / d;
  const p1 = new V2(px - h * cy / d, py + h * cx / d), p2 = new V2(px + h * cy / d, py - h * cx / d);
  const t1 = Math.atan2(p1.y, p1.x); let e = Math.atan2(p2.y, p2.x);
  if (e < t1) e += TAU;
  const m = (t1 + e) / 2;
  if (Math.hypot(R * Math.cos(m) - cx, R * Math.sin(m) - cy) < r2) e -= TAU;
  const outer = arcPts(0, 0, R, t1, e, 72);
  let s = Math.atan2(p2.y - cy, p2.x - cx), f = Math.atan2(p1.y - cy, p1.x - cx);
  if (f < s) f += TAU;
  const m2 = (s + f) / 2;
  if (Math.hypot(cx + r2 * Math.cos(m2), cy + r2 * Math.sin(m2)) > R) f -= TAU;
  const inner = arcPts(cx, cy, r2, s, f, 56);
  return new THREE.Shape([...outer, ...inner.slice(1, -1)]);
}

function frameShape(kind, r) {
  switch (kind) {
    case 'circle': return circleShape(0, 0, r);
    case 'hex': return roundedPath(polyPts(6, r * 1.08, Math.PI / 2), r * 0.22);
    case 'hexFlat': return roundedPath(polyPts(6, r * 1.08, 0), r * 0.22);
    case 'square': return roundedPath(polyPts(4, r * 1.2, Math.PI / 4), r * 0.36);
    case 'squircle': {
      const p = [];
      for (let i = 0; i < 96; i++) {
        const a = i / 96 * TAU, c = Math.cos(a), s = Math.sin(a), k = r * 0.98 * (1 + 0.035 * Math.sin(3 * a + 0.6));
        p.push(new V2(Math.sign(c) * Math.pow(Math.abs(c), 0.6) * k, Math.sign(s) * Math.pow(Math.abs(s), 0.6) * k));
      }
      return new THREE.Shape(p);
    }
    case 'drop': {
      const p = [];
      for (let i = 0; i < 96; i++) { const t = i / 96 * TAU; p.push(new V2(Math.sin(t) * Math.sin(t / 2) * 1.3 * r, (Math.cos(t) * 1.05 + 0.02) * r)); }
      return new THREE.Shape(p);
    }
    case 'crystal': {
      const raw = [[0.12, 1.18], [0.93, 0.72], [1.06, -0.28], [0.56, -1.08], [-0.46, -1.12], [-1.06, -0.22], [-0.78, 0.86]];
      return roundedPath(raw.map(([x, y]) => new V2(x * r * 0.97, y * r * 0.97)), r * 0.12);
    }
  }
}

function ext(shape, { depth = 0.1, bevel = 0.03, seg = 3, curve = 24 } = {}) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: seg, curveSegments: curve });
  g.translate(0, 0, -depth / 2);
  return g;
}

function iconMat(col, lv, s = 1) {
  const e = (lv >= 6 ? 0.85 : lv >= 5 ? 0.75 : lv >= 4 ? 0.6 : 0.28) * s;
  return new THREE.MeshPhysicalMaterial({
    color: col.clone().lerp(WHITE, 0.3), emissive: col, emissiveIntensity: e * 1.25,
    roughness: 0.18, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 0.8,
  });
}

// ------------------------------------------------------------------
// Cadre en verre : anneau biseauté + fond + lentille + halo
// ------------------------------------------------------------------
function buildFrame(kind, c, lv) {
  const g = new THREE.Group();
  const outer = frameShape(kind, 1);
  outer.holes.push(new THREE.Path(frameShape(kind, 0.8).getPoints(16)));
  const ringGeo = new THREE.ExtrudeGeometry(outer, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.07, bevelSegments: 6, curveSegments: 48 });
  ringGeo.translate(0, 0, -0.08);
  const rimMat = lv >= 6
    ? new THREE.MeshPhysicalMaterial({ color: new THREE.Color('#b9a57a'), metalness: 0.75, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.03,
        iridescence: 1, iridescenceIOR: 1.8, iridescenceThicknessRange: [250, 950], emissive: c, emissiveIntensity: 0.2, envMapIntensity: 1.2 })
    : new THREE.MeshPhysicalMaterial({ color: c.clone().multiplyScalar(0.32), metalness: 0.1, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03,
        emissive: c, emissiveIntensity: lv >= 4 ? 0.34 : 0.1, envMapIntensity: 0.85 });
  g.add(new THREE.Mesh(ringGeo, rimMat));

  const plateMat = new THREE.MeshPhysicalMaterial({ color: c.clone().multiplyScalar(0.06), roughness: 0.45, metalness: 0.1,
    emissive: c, emissiveIntensity: lv >= 4 ? 0.07 : 0.025, envMapIntensity: 0.35 });
  const plate = new THREE.Mesh(new THREE.ShapeGeometry(frameShape(kind, 0.84), 48), plateMat);
  plate.position.z = -0.1;
  g.add(plate);

  const lensGeo = new THREE.ExtrudeGeometry(frameShape(kind, 0.79), { depth: 0.02, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.015, bevelSegments: 10, curveSegments: 48 });
  lensGeo.translate(0, 0, 0.12);
  const lens = new THREE.Mesh(lensGeo, new THREE.MeshPhysicalMaterial({ color: WHITE, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02,
    transparent: true, opacity: 0.07, envMapIntensity: 1.6, depthWrite: false }));
  lens.renderOrder = 10;
  g.add(lens);

  const glowBase = lv >= 6 ? 1.0 : lv >= 5 ? 0.95 : lv >= 4 ? 0.75 : lv === 3 ? 0.3 : 0.12;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: c, transparent: true, opacity: glowBase,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.setScalar(3.6);
  glow.position.z = -0.5;
  g.add(glow);

  const pointBase = lv >= 4 ? 2.4 : 1.2;
  const point = new THREE.PointLight(c, pointBase, 0, 2);
  point.position.set(0, 0.1, 1.3);
  return { group: g, rimMat, plateMat, glow, glowBase, point, pointBase, rimBase: rimMat.emissiveIntensity };
}

// ------------------------------------------------------------------
// Les 12 icônes. Chacune renvoie { group, rest, update(t) }.
// rest = instant utilisé pour la pose figée (niveaux 1 à 3).
// ------------------------------------------------------------------
function buildSteps(k) {
  const g = new THREE.Group();
  const mkFoot = side => {
    const f = new THREE.Group(), m = k.mat();
    const parts = [ellipseShape(0, 0.04, 0.13, 0.18), ellipseShape(0, -0.25, 0.095, 0.105)];
    [[-0.1, 0.27, 0.042], [-0.035, 0.3, 0.037], [0.025, 0.29, 0.032], [0.075, 0.26, 0.028], [0.11, 0.21, 0.024]]
      .forEach(([x, y, r]) => parts.push(circleShape(x * side, y, r)));
    f.add(new THREE.Mesh(ext(parts, { depth: 0.08, bevel: 0.03 }), m));
    f.userData.mat = m;
    return f;
  };
  const feet = [{ f: mkFoot(-1), x: -0.22, y: -0.14, rz: 0.14 }, { f: mkFoot(1), x: 0.2, y: 0.14, rz: -0.1 }];
  feet.forEach(b => { b.f.rotation.z = b.rz; g.add(b.f); });
  const e0 = feet[0].f.userData.mat.emissiveIntensity;
  return { group: g, rest: 1.1, update(t) {
    feet.forEach((b, i) => {
      const p = (t * 0.62 + i * 0.5) % 1;
      const lift = p < 0.4 ? Math.sin(p / 0.4 * Math.PI) : 0;
      const fwd = p < 0.4 ? easeInOut(p / 0.4) : 1 - (p - 0.4) / 0.6;
      b.f.position.set(b.x, b.y + (fwd - 0.5) * 0.14, lift * 0.22);
      b.f.rotation.x = -lift * 0.55;
      const flash = p >= 0.4 ? Math.exp(-(p - 0.4) * 12) : 0;
      b.f.userData.mat.emissiveIntensity = e0 * (1 + flash * 1.6);
    });
  } };
}

function buildRunner(k) {
  const g = new THREE.Group();
  const mA = k.mat(), mB = k.mat(k.c.clone().multiplyScalar(0.6), 0.6);
  const cap = (len, m, r) => new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), m);
  const limb = (len, m, r) => { const p = new THREE.Group(), c = cap(len, m, r); c.position.y = -len / 2; p.add(c); return p; };
  const root = new THREE.Group(); root.scale.setScalar(0.95); g.add(root);
  const hip = new THREE.Group(); hip.position.set(-0.02, -0.02, 0); root.add(hip);
  const torso = new THREE.Group(); torso.rotation.z = -0.32; hip.add(torso);
  const body = cap(0.3, mA, 0.085); body.position.y = 0.17; torso.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 24, 16), mA); head.position.y = 0.47; torso.add(head);
  const mkArm = (m, z) => { const up = limb(0.19, m, 0.06); up.position.set(0, 0.3, z); const lo = limb(0.18, m, 0.055); lo.position.y = -0.19; up.add(lo); torso.add(up); return { up, lo }; };
  const mkLeg = (m, z) => { const th = limb(0.24, m, 0.07); th.position.set(0, 0, z); const sh = limb(0.24, m, 0.064); sh.position.y = -0.24; th.add(sh); hip.add(th); return { th, sh }; };
  const armA = mkArm(mA, 0.09), armB = mkArm(mB, -0.09), legA = mkLeg(mA, 0.07), legB = mkLeg(mB, -0.07);
  const lines = [];
  for (let i = 0; i < 3; i++) {
    const l = cap(0.22, new THREE.MeshBasicMaterial({ color: k.c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }), 0.018);
    l.rotation.z = Math.PI / 2; g.add(l); lines.push(l);
  }
  return { group: g, rest: 0.35, update(t) {
    const ph = t * TAU * 1.35;
    const pose = (leg, arm, o) => {
      const q = ph + o;
      leg.th.rotation.z = 0.15 + 0.85 * Math.sin(q);
      leg.sh.rotation.z = -(0.35 + 0.95 * (0.5 + 0.5 * Math.sin(q + 1.9)));

function buildDuo(k) {
  const g = new THREE.Group();
  const prof = [[0.001, 0], [0.25, 0], [0.275, 0.05], [0.26, 0.15], [0.2, 0.23], [0.1, 0.285], [0.001, 0.3]].map(([x, y]) => new V2(x, y));
  const bustGeo = new THREE.LatheGeometry(prof, 40), headGeo = new THREE.SphereGeometry(0.15, 32, 20);
  const mk = (m, s) => {
    const p = new THREE.Group(), inner = new THREE.Group();
    const b = new THREE.Mesh(bustGeo, m); b.scale.z = 0.7;
    const h = new THREE.Mesh(headGeo, m); h.position.y = 0.47; h.scale.z = 0.85;
    inner.add(b, h); inner.scale.setScalar(s); p.add(inner);
    return { p, inner, s };
  };
  const A = mk(k.mat(k.c.clone().lerp(WHITE, 0.25)), 1.0), B = mk(k.mat(k.c.clone().multiplyScalar(0.8), 0.9), 1.08);
  const people = [{ o: A, x: -0.19, y: -0.5, z: 0.12, ph: 0, dir: -1 }, { o: B, x: 0.2, y: -0.42, z: -0.1, ph: Math.PI, dir: 1 }];

}

function buildFlame(k) {
  const g = new THREE.Group();
  const layer = (sx, sy, bottom, col, z, s, seed) => {
    const p = [];
    for (let i = 0; i < 72; i++) { const t = i / 72 * TAU; p.push(new V2(Math.sin(t) * Math.pow(Math.sin(t / 2), 1.15) * sx, Math.cos(t) * sy)); }
    const geo = ext(new THREE.Shape(p), { depth: 0.06, bevel: 0.05, seg: 4 });
    const m = new THREE.Mesh(geo, k.mat(col, s)); m.position.set(0, bottom + sy, z); g.add(m);
    return { geo, orig: geo.attributes.position.array.slice(), sy, seed };
  };
  const L = [layer(0.62, 0.52, -0.46, k.c, 0, 1, 0), layer(0.42, 0.36, -0.42, k.tint('#ffae3c'), 0.09, 1.2, 1.7), layer(0.24, 0.21, -0.36, k.tint('#fff0c4'), 0.17, 1.5, 3.1)];
  return { group: g, rest: 0.3, update(t) {
    L.forEach(l => {
      const a = l.geo.attributes.position, o = l.orig;
      for (let i = 0; i < a.count; i++) {
        const x = o[i * 3], y = o[i * 3 + 1], h = (y / l.sy + 1) / 2, hh = h * h;
        a.array[i * 3] = x * (1 + 0.06 * Math.sin(t * 9 + l.seed)) + Math.sin(t * 6.5 + y * 5 + l.seed) * 0.07 * hh * (l.sy / 0.5);
        a.array[i * 3 + 1] = y * (1 + 0.07 * Math.sin(t * 7.3 + l.seed * 2) * h);
      }
      a.needsUpdate = true;
      l.geo.computeVertexNormals();
    });
    k.frame.point.intensity = k.frame.pointBase * (0.85 + 0.2 * Math.sin(t * 11) + 0.1 * Math.sin(t * 17));
  } };
}

function buildCalendar(k) {
  const g = new THREE.Group(), m = k.mat();
  const W = 0.9, H = 0.82, cy = -0.06, th = 0.075;
  const outer = roundRect(-W / 2, cy - H / 2, W, H, 0.15);
  outer.holes.push(new THREE.Path(roundRect(-W / 2 + th, cy - H / 2 + th, W - 2 * th, H - 2 * th, 0.09).getPoints(8)));
  g.add(new THREE.Mesh(ext(outer, { depth: 0.08, bevel: 0.025 }), m));
  g.add(new THREE.Mesh(ext(roundRect(-W / 2 + th, cy + H / 2 - 0.24, W - 2 * th, 0.05, 0.02), { depth: 0.05, bevel: 0.012 }), m));
  [-0.2, 0.2].forEach(x => { const r = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.1, 4, 12), m); r.position.set(x, cy + H / 2 + 0.02, 0.02); g.add(r); });
  const dots = [];
  for (let i = 0; i < 7; i++) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.032, 16, 12), k.mat(k.c, 1));
    d.position.set(-0.3 + i * 0.1, cy + H / 2 - 0.12, 0.02); g.add(d); dots.push(d);
  }
  const P = (x, y) => new V3(x, y, 0.03);
  const path = new THREE.CurvePath();
  path.add(new THREE.LineCurve3(P(-0.2, -0.1), P(-0.06, -0.24)));
  path.add(new THREE.LineCurve3(P(-0.06, -0.24), P(0.22, 0.03)));
  const checkMat = k.mat(k.c.clone().lerp(WHITE, 0.2), 1.3);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(path, 64, 0.05, 12, false), checkMat);
  const capA = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), checkMat), capB = capA.clone();
  capA.position.copy(path.getPointAt(0));
  g.add(tube, capA, capB);
  const dotBase = checkMat.emissiveIntensity;
  return { group: g, rest: 3.0, update(t) {
    const p = t % 4;
    dots.forEach((d, i) => {
      const since = p - (0.2 + i * 0.17), on = since > 0 && p < 3.6;
      d.material.emissiveIntensity = on ? dotBase * (0.4 + 1.2 * Math.exp(-since * 6)) : 0.04;
      d.scale.setScalar(on ? 1 + 0.5 * Math.exp(-since * 8) : 0.8);
    });
    const draw = p < 3.5 ? easeOut(clamp01((p - 1.5) / 0.55)) : 1 - easeInOut(clamp01((p - 3.5) / 0.45));
    tube.geometry.setDrawRange(0, Math.floor(draw * 64) * 72);
    capA.visible = capB.visible = draw > 0.02;
    capB.position.copy(path.getPointAt(Math.max(draw, 0.001)));
    const s = p - 2.05, pop = s > 0 && p < 3.5 ? Math.exp(-s * 5) * Math.sin(s * 18) : 0;
    g.scale.setScalar(1 + pop * 0.06);
  } };
}

function buildTarget(k) {
  const g = new THREE.Group(), board = new THREE.Group(); g.add(board);
  const mA = k.mat(), mB = k.mat(k.c.clone().multiplyScalar(0.7), 0.8);
  [[0.6, 0.055, mA], [0.41, 0.05, mB], [0.22, 0.045, mA]].forEach(([r, tb, m]) => board.add(new THREE.Mesh(new THREE.TorusGeometry(r, tb, 16, 96), m)));
  const bullMat = k.mat(k.c, 1.4), bullBase = bullMat.emissiveIntensity;
  const bull = new THREE.Mesh(new THREE.SphereGeometry(0.085, 24, 16), bullMat); bull.scale.z = 0.6; board.add(bull);
  const am = k.mat(k.tint('#e8f4ff'), 0.8); am.transparent = true;
  const arrow = new THREE.Group();
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.17, 20), am); head.rotation.x = Math.PI; head.position.y = 0.085;
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.72, 12), am); shaft.position.y = 0.53;
  arrow.add(head, shaft);
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * TAU, f = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.16, 0.07), am);
    f.position.set(Math.cos(a) * 0.035, 0.82, Math.sin(a) * 0.035); f.rotation.y = Math.PI / 2 - a; arrow.add(f);
  }
  const D = new V3(0.8, 0.75, 0.45).normalize();
  arrow.quaternion.setFromUnitVectors(new V3(0, 1, 0), D);
  board.add(arrow);
  const ripple = new THREE.Mesh(new THREE.TorusGeometry(1, 0.02, 8, 96), new THREE.MeshBasicMaterial({ color: k.c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  board.add(ripple);
  return { group: g, rest: 1.8, update(t) {
    const p = t % 2.8, fly = 0.55;
    const dist = p < fly ? 0.02 + (1 - Math.pow(p / fly, 2)) * 3.2 : 0.02;
    const op = p > 2.3 ? Math.max(0, 1 - (p - 2.3) / 0.4) : 1;
    arrow.position.copy(D).multiplyScalar(dist);
    am.opacity = op; arrow.visible = op > 0.01;
    const s = p - fly, wob = s > 0 ? Math.sin(s * 22) * Math.exp(-s * 5) : 0;
    board.rotation.set(wob * 0.22, -wob * 0.12, 0);
    ripple.visible = s > 0 && s < 0.9;
    ripple.scale.setScalar(0.15 + Math.max(0, s) * 1.0);
    ripple.material.opacity = Math.max(0, 1 - s / 0.9) * 0.8;
    bullMat.emissiveIntensity = bullBase * (1 + (s > 0 ? 2.5 * Math.exp(-s * 4) : 0));
  } };
}

function buildCycle(k) {
  const g = new THREE.Group(), spin = new THREE.Group(); g.add(spin);
  const m = k.mat(), base = m.emissiveIntensity, R = 0.45, arc = 2.25;
  for (let j = 0; j < 2; j++) {
    const a = new THREE.Group(); a.rotation.z = j * Math.PI + 0.5;
    a.add(new THREE.Mesh(new THREE.TorusGeometry(R, 0.075, 16, 80, arc), m));
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.24, 24), m);
    cone.position.set(Math.cos(arc) * R - Math.sin(arc) * 0.1, Math.sin(arc) * R + Math.cos(arc) * 0.1, 0);
    cone.rotation.z = arc;
    a.add(cone); spin.add(a);
  }
  return { group: g, rest: 0, update(t) {
    const P = 1.6, n = Math.floor(t / P), q = (t % P) / P;
    spin.rotation.z = (n + easeInOut(Math.min(1, q / 0.5))) * Math.PI;
    m.emissiveIntensity = base * (1 + (q > 0.5 ? 1.2 * Math.exp(-(q - 0.5) * 10) : 0));
    g.rotation.x = Math.sin(t * 0.7) * 0.25;
  } };
}

function buildChain(k) {
  const g = new THREE.Group(), chain = new THREE.Group(), spin = new THREE.Group();
  chain.rotation.z = 0.62; chain.scale.setScalar(0.92); chain.add(spin); g.add(chain);
  const a = 0.2, b = 0.17, pts = [];
  arcPts(a, 0, b, -Math.PI / 2, Math.PI / 2, 16).forEach(p => pts.push(p));
  arcPts(-a, 0, b, Math.PI / 2, Math.PI * 1.5, 16).forEach(p => pts.push(p));
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new V3(p.x, p.y, 0)), true, 'centripetal');
  const geo = new THREE.TubeGeometry(curve, 140, 0.068, 16, true);
  const A = new THREE.Mesh(geo, k.mat(k.c.clone().lerp(WHITE, 0.2))), B = new THREE.Mesh(geo, k.mat(k.c, 0.9));
  const d = (2 * a + b) / 2;
  B.rotation.x = Math.PI / 2;
  spin.add(A, B);
  return { group: g, rest: 0.6, update(t) {
    spin.rotation.x = t * 0.8;
    const pull = 0.025 * Math.max(0, Math.sin(t * 2));
    A.position.x = -d - pull; B.position.x = d + pull;
  } };
}

function buildSun(k) {
  const g = new THREE.Group(), H = -0.2;
  const sunG = new THREE.Group(); sunG.position.z = -0.08; g.add(sunG);
  const sun = new THREE.Mesh(new THREE.SphereGeometry(0.3, 40, 24), k.mat(k.c, 1.3)); sun.scale.z = 0.3; sunG.add(sun);
  const rm = k.mat(k.c, 1.1), rays = [];
  for (let i = 0; i < 7; i++) {
    const a = Math.PI * (0.12 + 0.76 * i / 6), r = new THREE.Group(); r.rotation.z = a - Math.PI / 2;
    const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.035, 0.13, 4, 10), rm); r.add(c); sunG.add(r); rays.push(c);
  }
  // Cache sous l'horizon : segment de disque de la couleur du fond
  const R = 0.84, t1 = Math.asin(H / R), t2 = Math.PI - t1 - TAU;
  const occ = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(arcPts(0, 0, R, t1, t2, 48))), k.frame.plateMat);
  occ.position.z = 0.03; g.add(occ);
  const bar = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 1.3, 6, 12), k.mat(k.c, 1.2));
  bar.rotation.z = Math.PI / 2; bar.position.set(0, H, 0.05); g.add(bar);
  const plateBase = k.frame.plateMat.emissiveIntensity;
  return { group: g, rest: 3.0, update(t) {
    const p = t % 5.2;
    const set = p > 4.4 ? easeInOut(clamp01((p - 4.4) / 0.8)) : 0;
    const h = easeOut(clamp01(p / 2.0)) - set;
    sunG.position.y = -0.62 + 0.64 * h;
    rays.forEach((c, i) => {
      const gr = clamp01((p - 1.1 - i * 0.07) / 0.4) * (1 - set);
      c.scale.set(1, Math.max(0.001, gr * (1 + 0.12 * Math.sin(t * 3 + i))), 1);
      c.position.y = 0.4 + 0.06 * gr;
    });
    k.frame.plateMat.emissiveIntensity = plateBase + 0.12 * h;
  } };
}

function buildMoon(k) {
  const g = new THREE.Group(), moonG = new THREE.Group(); moonG.position.set(-0.06, -0.03, 0); g.add(moonG);
  moonG.add(new THREE.Mesh(ext(crescent(0.47, 0.2, 0.15, 0.4), { depth: 0.12, bevel: 0.05, seg: 5, curve: 64 }), k.mat()));
  const sm = k.mat(k.tint('#f3ecff'), 1.3), sBase = sm.emissiveIntensity;
  const star = new THREE.Mesh(ext(starShape(5, 0.14, 0.06), { depth: 0.05, bevel: 0.02 }), sm);
  star.position.set(0.22, 0.17, 0.08); moonG.add(star);
  const tiny = [[-0.45, 0.38], [0.5, -0.3], [0.4, 0.46], [-0.3, -0.5]].map(([x, y], i) => {
    const m = k.mat(k.tint('#f3ecff'), 1); const s = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), m);
    s.position.set(x, y, 0); g.add(s); return { m, base: m.emissiveIntensity, i };

  } };
}

function buildBolt(k) {
  const g = new THREE.Group();
  const pts = [[0.14, 0.64], [-0.3, -0.04], [-0.03, -0.04], [-0.16, -0.64], [0.31, 0.07], [0.04, 0.07]].map(([x, y]) => new V2(x, y));
  const m = k.mat(k.c.clone().lerp(WHITE, 0.3), 1.1), base = m.emissiveIntensity;
  const bolt = new THREE.Mesh(ext(roundedPath(pts, 0.03), { depth: 0.14, bevel: 0.045, seg: 4 }), m);
  g.add(bolt);
  const arcs = [[0.14, 0.64, 1.25], [-0.16, -0.64, -1.9], [0.31, 0.07, 0.1]].map(([x, y, ang]) => {
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(9 * 3), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: k.c.clone().lerp(WHITE, 0.5), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    g.add(line); return { line, x, y, ang };
  });
  return { group: g, rest: 5, update(t) {
    const p = t % 2.4;
    let f = 0;
    [0, 0.1, 0.26].forEach(s => { const d = p - s; if (d >= 0) f = Math.max(f, Math.exp(-d * 28)); });
    const seed = Math.floor(t * 24);
    m.emissiveIntensity = base * (0.8 + 0.1 * Math.sin(t * 2) + f * 2.6);
    bolt.position.set((hash(seed) - 0.5) * 0.05 * f, (hash(seed + 3) - 0.5) * 0.05 * f, 0);
    k.frame.glow.material.opacity = k.frame.glowBase * (0.7 + f * 1.2);
    k.frame.point.intensity = k.frame.pointBase * (1 + f * 4);
    k.frame.rimMat.emissiveIntensity = k.frame.rimBase * (1 + f * 3);
    arcs.forEach((a, j) => {
      const arr = a.line.geometry.attributes.position.array, ex = Math.cos(a.ang), ey = Math.sin(a.ang);
      for (let i = 0; i < 9; i++) {
        const q = i / 8, j1 = i === 0 || i === 8 ? 0 : (hash(seed * 13 + i + j * 50) - 0.5) * 0.14;
        arr[i * 3] = a.x + ex * 0.28 * q - ey * j1;
        arr[i * 3 + 1] = a.y + ey * 0.28 * q + ex * j1;
        arr[i * 3 + 2] = 0.05;
      }
      a.line.geometry.attributes.position.needsUpdate = true;
      a.line.material.opacity = f > 0.08 ? f : 0;
    });
  } };
}

function buildDumbbell(k) {
  const g = new THREE.Group(), db = new THREE.Group(); g.add(db);
  const mPlate = k.mat(), mBar = k.mat(k.c.clone().lerp(WHITE, 0.5), 0.5), base = mPlate.emissiveIntensity;
  const cyl = (r, h, m) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 40), m); c.rotation.z = Math.PI / 2; return c; };
  db.add(cyl(0.035, 1.02, mBar));
  [-1, 1].forEach(s => {
    const p1 = cyl(0.25, 0.085, mPlate); p1.position.x = s * 0.27;
    const p2 = cyl(0.19, 0.07, mPlate); p2.position.x = s * 0.37;
    const col = cyl(0.06, 0.05, mBar); col.position.x = s * 0.2;
    const end = cyl(0.05, 0.04, mBar); end.position.x = s * 0.44;

    db.position.y = -0.14 + up * 0.28;

    db.rotation.y = 0.55 * Math.sin(t * 0.5);

    mPlate.emissiveIntensity = base * (1 + 0.8 * (p > 0.55 && p < 1.0 ? Math.sin((p - 0.55) / 0.45 * Math.PI) : 0));
  } };
}

function makeParticles(type, color, n) {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const seeds = [...Array(n)].map((_, i) => ({ s: hash(i * 7.13), x: hash(i * 3.1) - 0.5, z: hash(i * 5.7) - 0.5 }));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: type === 'sparkle' ? 0.11 : 0.09, map: DOT, vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  return { points: pts, update(t) {
    seeds.forEach((sd, i) => {
      let x, y, z, b;
      if (type === 'embers') {
        const p = (t * 0.55 + sd.s) % 1;
        x = sd.x * 0.5 + Math.sin(t * 3 + sd.s * 20) * 0.06 * p; y = -0.35 + p * 1.3; z = 0.15 + sd.z * 0.3; b = Math.sin(p * Math.PI);
      } else if (type === 'stars') {
        const a = sd.s * TAU, r = 0.95 + sd.x * 0.35;
        x = Math.cos(a) * r; y = Math.sin(a) * r; z = -0.2 + sd.z * 0.4; b = Math.pow(Math.max(0, Math.sin(t * 2.2 + sd.s * 30)), 6);
      } else if (type === 'sparkle') {
        const a = sd.s * TAU + t * 0.35;
        x = Math.cos(a) * 1.2; y = Math.sin(a) * 1.15; z = Math.sin(a) * 0.3; b = 0.2 + Math.pow(Math.max(0, Math.sin(t * 3 + sd.s * 40)), 10) * 1.6;
      } else {
        const p = (t * 0.18 + sd.s) % 1, a = sd.s * TAU, r = 0.95 + sd.x * 0.3;
        x = Math.cos(a) * r + Math.sin(t + sd.s * 9) * 0.04; y = Math.sin(a) * r * 0.9 + (p - 0.5) * 0.5; z = sd.z * 0.8; b = Math.sin(p * Math.PI);
      }
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      col[i * 3] = color.r * b; col[i * 3 + 1] = color.g * b; col[i * 3 + 2] = color.b * b;
    });
    geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true;
  } };
}

function disposeScene(s) {
  s.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
  });
}

// ------------------------------------------------------------------
// Un badge = une scène + une caméra + le glisser pour tourner
// ------------------------------------------------------------------
class Badge {
  constructor(def, i, stage) {
    this.def = def; this.i = i; this.stage = stage;
    this.camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
    this.camera.position.set(0, 0, 5.6);
    const d = this.drag = { yaw: 0, pitch: 0, active: false };
    stage.addEventListener('pointerdown', e => {
      d.active = true; d.x = e.clientX; d.y = e.clientY; d.y0 = d.yaw; d.p0 = d.pitch;
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    });
    stage.addEventListener('pointermove', e => {
      if (!d.active) return;
      d.yaw = d.y0 + (e.clientX - d.x) * 0.012;
      d.pitch = Math.max(-0.8, Math.min(0.8, d.p0 + (e.clientY - d.y) * 0.008));
    });
    const end = () => { d.active = false; };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
  }
  build(lv) {
    if (this.scene) disposeScene(this.scene);
    const scene = this.scene = new THREE.Scene();
    scene.environment = ENV;
    const c = tint(this.def.color, lv);
    const frame = buildFrame(lv >= 6 ? 'hex' : this.def.frame, c, lv);
    const pivot = this.pivot = new THREE.Group();
    pivot.add(frame.group);
    scene.add(pivot, frame.point);
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2.5, 3, 4);
    const back = new THREE.DirectionalLight(c, 1.0); back.position.set(-3, -1, -2);
    scene.add(key, back);
    const k = { c, lv, frame, tint: h => tint(h, lv), mat: (col = c, s = 1) => iconMat(col, lv, s) };
    this.icon = this.def.build(k);
    this.icon.group.position.z = 0.06;
    pivot.add(this.icon.group);
    this.fx = [];
    if (lv >= 5) {
      const pc = this.def.particles === 'embers' ? tint('#ffb347', lv) : this.def.particles === 'stars' ? tint('#efe8ff', lv) : c.clone().lerp(WHITE, 0.3);
      this.fx.push(makeParticles(this.def.particles || 'motes', pc, 26));
    }
    if (lv >= 6) {
      this.fx.push(makeParticles('sparkle', new THREE.Color('#ffe7a8'), 16));
      this.sweep = new THREE.PointLight(0xffffff, 0, 0, 2); this.sweep.position.set(-3, 0.6, 1.5); scene.add(this.sweep);
    } else this.sweep = null;
    this.fx.forEach(f => pivot.add(f.points));
    this.frame = frame;
    this.lv = lv;
    this.animated = lv >= ANIM_FROM && !REDUCED;
    if (!this.animated) { this.icon.update(this.icon.rest); this.fx.forEach(f => f.update(this.icon.rest)); }
  }
  tick(t, dt) {
    const T = t + this.i * 0.37, d = this.drag;
    if (!d.active) { const f = 1 - Math.exp(-dt * 4); d.yaw -= d.yaw * f; d.pitch -= d.pitch * f; }
    let yaw = -0.32, pitch = 0.12, y = 0;
    if (this.animated) { yaw = Math.sin(T * 0.55) * 0.38; pitch = Math.sin(T * 0.8 + 1) * 0.1; y = Math.sin(T * 1.1) * 0.035; }
    this.pivot.rotation.set(pitch + d.pitch, yaw + d.yaw, 0);
    this.pivot.position.y = y;
    if (!this.animated) return;
    this.frame.glow.material.opacity = this.frame.glowBase * (0.85 + 0.15 * Math.sin(T * 2));
    this.icon.update(T);
    this.fx.forEach(f => f.update(T));
    if (this.sweep) {
      const q = (T / 3.4) % 1;
      this.sweep.position.x = -2.4 + q * 4.8;
      this.sweep.intensity = 9 * Math.sin(Math.min(1, q / 0.7) * Math.PI);
    }
  }
}

// ------------------------------------------------------------------
// Page
// ------------------------------------------------------------------
const stages = [...document.querySelectorAll('.stage')];
const badges = stages.map((s, i) => new Badge(DEFS[i], i, s));

const NOTES = {
  1: 'Niveau 1 : badge gagné, figé et encore gris.',
  2: 'Niveau 2 : toujours figé, la couleur arrive.',
  3: 'Niveau 3 : figé, presque en couleur.',
  4: 'Niveau 4 : chaque badge prend vie avec sa propre animation.',
  5: 'Niveau 5 : en plus, des particules et un halo plus fort.',
  6: 'Niveau 6 : cadre hexagonal irisé, étincelles et reflet qui balaie le verre.',
};
const seg = document.getElementById('seg'), note = document.getElementById('lvnote');
let level = parseInt(qs.get('lv'), 10);
if (!(level >= 1 && level <= 6)) {
  try { level = parseInt(localStorage.getItem('reiz-badge-level'), 10); } catch (_) {}
  if (!(level >= 1 && level <= 6)) level = 5;
}
function setLevel(lv) {
  level = lv;
  try { localStorage.setItem('reiz-badge-level', String(lv)); } catch (_) {}
  [...seg.children].forEach(b => b.setAttribute('aria-checked', String(+b.dataset.lv === lv)));
  note.textContent = NOTES[lv];
  badges.forEach(b => b.build(lv));
}
for (let lv = 1; lv <= 6; lv++) {
  const b = document.createElement('button');
  b.type = 'button'; b.id = 'lv' + lv; b.dataset.lv = lv; b.textContent = lv;
  b.setAttribute('role', 'radio');
  b.setAttribute('aria-label', 'Niveau ' + lv + (lv >= ANIM_FROM ? ', animé' : ', figé'));
  if (lv >= ANIM_FROM) b.className = 'anim';
  b.addEventListener('click', () => setLevel(lv));
  seg.appendChild(b);
}
setLevel(level);

let last = performance.now();
function render(t, dt) {
  const w = window.innerWidth, h = window.innerHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) renderer.setSize(w, h, false);
  renderer.setScissorTest(false);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.setScissorTest(true);
  renderer.setClearColor(CARD, 1);
  badges.forEach(b => {
    const r = b.stage.getBoundingClientRect();
    if (r.bottom < 0 || r.top > h || r.right < 0 || r.left > w || r.width < 2) return;
    const x = r.left, y = h - r.bottom;
    renderer.setViewport(x, y, r.width, r.height);
    renderer.setScissor(x, y, r.width, r.height);
    const aspect = r.width / r.height;
    if (b.camera.aspect !== aspect) { b.camera.aspect = aspect; b.camera.updateProjectionMatrix(); }
    b.tick(t, dt);
    renderer.render(b.scene, b.camera);
  });
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  render(now / 1000, dt);
  requestAnimationFrame(loop);
}
if (FIXED_T !== null) {
  render(FIXED_T, 1);
  addEventListener('resize', () => render(FIXED_T, 1));
  seg.addEventListener('click', () => render(FIXED_T, 1));
} else {
  requestAnimationFrame(loop);
}
</script>
