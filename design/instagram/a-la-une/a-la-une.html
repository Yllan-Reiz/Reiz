<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Reiz à la une</title>
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(../../store/fonts/Inter_400Regular.ttf); }
  @font-face { font-family: Inter; font-weight: 500; src: url(../../store/fonts/Inter_500Medium.ttf); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../../store/fonts/Inter_600SemiBold.ttf); }
  @font-face { font-family: Inter; font-weight: 700; src: url(../../store/fonts/Inter_700Bold.ttf); }
  @font-face { font-family: Inter; font-weight: 800; src: url(../../store/fonts/Inter_800ExtraBold.ttf); }
  @font-face { font-family: Inter; font-weight: 900; src: url(../../store/fonts/Inter_900Black.ttf); }
  @font-face { font-family: Ionicons; src: url(../../store/fonts/Ionicons.ttf); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  body.single { overflow: hidden; }
  body.single > section:not(.on) { display: none; }
  body:not(.single) { display: flex; flex-wrap: wrap; gap: 30px; padding: 30px; }
  .ion { font-family: Ionicons; font-style: normal; font-weight: normal; line-height: 1; display: inline-block; }

  /* ============ Couvertures « à la une » : 1080x1920, Instagram garde un cercle centré ============ */
  .hl { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
  .hl .ph { position: absolute; inset: -90px; background: center / cover; filter: blur(30px) saturate(1.3) brightness(.7); }
  .hl .tint { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 46%, transparent) 0, transparent 42%),
      radial-gradient(circle at 50% 50%, transparent 26%, rgba(0,0,0,.62) 60%); }
  /* lentille de verre, comme les bulles de l'appli */
  .hl .lens { position: absolute; left: 50%; top: 50%; width: 800px; height: 800px; margin: -400px 0 0 -400px; border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.04) 44%, rgba(0,0,0,.24));
    box-shadow: inset 0 4px 0 rgba(255,255,255,.42), inset 0 0 0 3px rgba(255,255,255,.13), inset 0 -60px 110px rgba(0,0,0,.3), inset 0 50px 90px rgba(255,255,255,.06), 0 50px 140px rgba(0,0,0,.6);
    backdrop-filter: blur(22px) saturate(1.6); }
  .hl .gem { position: absolute; left: 50%; top: 50%; width: 640px; height: 640px; margin: -320px 0 0 -320px; display: grid; place-items: center; }
  .hl .gem img { width: 540px; height: 540px; }
  .hl .gem img, .hl .gem svg { object-fit: contain; filter: drop-shadow(0 0 46px color-mix(in srgb, var(--c) 70%, transparent)) drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
  .appicon { position: relative; border-radius: 23%; background: #000 url(../../../assets/icon.png) center / cover; overflow: hidden;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.2), 0 0 90px rgba(255,255,255,.28), 0 40px 70px rgba(0,0,0,.6); }
  .appicon::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(155deg, rgba(255,255,255,.3) 0, rgba(255,255,255,.05) 34%, transparent 52%, rgba(255,255,255,.07) 100%);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.5); }
  .hl .appicon { width: 430px; height: 430px; }
  .hl .gem svg { width: 640px; height: 640px; }

  /* ============ Stories d'ouverture : dessinées en points (432x768) puis agrandies x2,5 = 1080x1920 ============ */
  .st { position: relative; width: 432px; height: 768px; zoom: 2.5; overflow: hidden; background: #0a0a0a; }
  .st .ph { position: absolute; inset: -30px; background: center / cover; filter: blur(13px) saturate(1.25) brightness(.62); }
  .st .veil { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 78% 60%, color-mix(in srgb, var(--c) 30%, transparent) 0, transparent 52%),
      linear-gradient(180deg, rgba(0,0,0,.72) 0, rgba(0,0,0,.34) 34%, rgba(0,0,0,.38) 62%, rgba(0,0,0,.8) 100%); }
  .st .logo { position: absolute; left: 34px; top: 100px; height: 19px; }
  .glass { background: linear-gradient(180deg, rgba(78,78,84,.62), rgba(40,40,44,.62)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.4); backdrop-filter: blur(22px) saturate(1.6); }
  .clear { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.34), inset 0 0 0 1px rgba(255,255,255,.1); }
  .fl { background: rgba(30,30,34,.74); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.1), 0 18px 44px rgba(0,0,0,.6); }
  .st .tag { position: absolute; right: 34px; top: 95px; border-radius: 20px; padding: 8px 13px; font: 700 10.5px/12px Inter; letter-spacing: 1.5px; text-transform: uppercase; }
  .st .in { position: absolute; left: 34px; right: 34px; top: 150px; }
  .st h1 { font: 900 47px/.98 Inter; letter-spacing: -.045em; text-wrap: balance; }
  .st .sub { font: 400 17px/1.4 Inter; color: rgba(235,235,245,.74); margin-top: 14px; text-wrap: pretty; }
  .st .sub b { color: #fff; font-weight: 700; }
  .st .hint { position: absolute; left: 34px; right: 34px; top: 612px; font: 600 13px/17px Inter; color: rgba(235,235,245,.62); }
  .lab { font: 700 10px/12px Inter; color: rgba(235,235,245,.6); letter-spacing: 1.5px; text-transform: uppercase; }
  .panel { border-radius: 28px; padding: 18px; margin-top: 26px; position: relative; }
  .float { position: absolute; filter: drop-shadow(0 0 22px color-mix(in srgb, var(--c) 75%, transparent)) drop-shadow(0 14px 18px rgba(0,0,0,.5)); }
  .btn { height: 48px; border-radius: 16px; background: #fff; color: #000; font: 800 15px/48px Inter; letter-spacing: -.01em; text-align: center; }
  .fp { display: inline-flex; align-items: center; gap: 8px; border-radius: 40px; padding: 10px 16px 10px 12px; font: 700 14px/1 Inter; white-space: nowrap; }
  .fp .n { width: 22px; height: 22px; border-radius: 11px; background: #fff; color: #000; font: 800 12px/22px Inter; text-align: center; flex: none; }
  .fp .ion { font-size: 16px; }
  .av { border-radius: 50%; border: 1.5px solid #333; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font: 800 14px/1 Inter; flex: none; width: 40px; height: 40px; }
  .pill { padding: 10px 15px; border-radius: 100px; background: rgba(20,20,20,.72); border: 1.5px solid rgba(255,255,255,.12); font: 700 14px/17px Inter; color: rgba(235,235,245,.6); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .pill.on { background: #fff; border-color: #fff; color: #000; }
  .pill .ion { font-size: 15px; }

  /* lignes d'une carte */
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,.09); }
  .row .ic { width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; flex: none; font-size: 18px; }
  .row .ic img { width: 38px; height: 38px; }
  .row .t { font: 700 15px/19px Inter; letter-spacing: -.01em; }
  .row .d { font: 400 12.5px/16px Inter; color: rgba(235,235,245,.62); margin-top: 2px; }

  /* publication du fil */
  .media { position: relative; border-radius: 22px; overflow: hidden; background: #141414 center / cover; box-shadow: 0 22px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.1); }
  .gauge { display: flex; align-items: center; gap: 12px; }
  .gt { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
  .gf { height: 8px; border-radius: 4px; background: #fff; }
  .gl { font: 800 14px/17px Inter; letter-spacing: -.2px; }

  /* réponse de la FAQ */
  .answer { font: 500 19px/1.36 Inter; letter-spacing: -.015em; color: #f1f1f4; text-wrap: pretty; }
  .answer b { font-weight: 800; color: #fff; }

  /* aperçu de la rangée (contrôle visuel, pas à publier) */
  #apercu { width: 1080px; background: #000; padding: 56px 36px 60px; }
  #apercu h2 { font: 800 24px/1 Inter; letter-spacing: .16em; text-transform: uppercase; color: #8a8a8a; margin-bottom: 36px; }
  #apercu .rg { display: flex; gap: 26px; }
  #apercu .it { width: 146px; text-align: center; font: 500 21px/1.2 Inter; color: #eee; }
  #apercu .ring { width: 146px; height: 146px; border-radius: 50%; border: 2px solid #3a3a3a; padding: 6px; margin-bottom: 12px; }
  #apercu .ring div { width: 100%; height: 100%; border-radius: 50%; background-size: 124% auto; background-position: center; }
</style>
</head>
<body>
<script>
'use strict';
const ST = '../../store/assets/';
const GL = { flame: 0xf313, people: 0xf4a3, star: 0xf599, lock: 0xf3c8, check: 0xf21d, camera: 0xf1dc, apple: 0xf3d8, chat: 0xf215, padd: 0xf4a6 };
const I = k => `<span class="ion">${String.fromCodePoint(GL[k])}</span>`;
const badge = n => `../../../assets/badges/${n}.png`;
const mini = n => `../../badges/transparent/${n}.png`;

/* Gemme de verre dessinée dans l'esprit des badges de l'appli, pour les onglets sans badge existant. */
let gid = 0;
function gem({ shape = 'circle', c1, c2, icon }) {
  const id = 'g' + (++gid);
  const S = {
    circle: `<circle cx="256" cy="256" r="196"/>`,
    hex: `<path d="M256 70c10 0 20 3 28 8l112 64c17 10 28 28 28 48v132c0 20-11 38-28 48l-112 64c-17 10-39 10-56 0l-112-64c-17-10-28-28-28-48V190c0-20 11-38 28-48l112-64c8-5 18-8 28-8z"/>`,
    squircle: `<rect x="70" y="70" width="372" height="372" rx="112"/>`,
    diamond: `<rect x="86" y="86" width="340" height="340" rx="84" transform="rotate(45 256 256)"/>`,
  }[shape];
  const use = attrs => S.replace('/>', ` ${attrs}/>`);
  return `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="${id}b" cx="50%" cy="30%" r="78%">
      <stop offset="0" stop-color="${c1}" stop-opacity=".34"/><stop offset=".5" stop-color="${c2}" stop-opacity=".5"/><stop offset="1" stop-color="#03040c" stop-opacity=".92"/>
    </radialGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".24" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset=".82" stop-color="${c1}"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="${id}i" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${c1}"/></linearGradient>
    <filter id="${id}g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="${id}s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="${id}t" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="${id}n" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/><feFlood flood-color="${c1}" flood-opacity=".9"/><feComposite in2="b" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="${id}c">${S}</clipPath>
  </defs>
  <g filter="url(#${id}g)" opacity=".75">${use(`fill="none" stroke="${c1}" stroke-width="22"`)}</g>
  ${use(`fill="url(#${id}b)"`)}
  <g clip-path="url(#${id}c)">
    ${use(`fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="84"`)}
    ${use(`fill="none" stroke="url(#${id}r)" stroke-opacity=".3" stroke-width="84"`)}
    <ellipse cx="170" cy="120" rx="170" ry="58" transform="rotate(-30 170 120)" fill="#fff" opacity=".36" filter="url(#${id}s)"/>
    <ellipse cx="356" cy="418" rx="150" ry="44" transform="rotate(-30 356 418)" fill="${c1}" opacity=".5" filter="url(#${id}s)"/>
    <g transform="translate(256 256) scale(.79) translate(-256 -256)">
      ${use(`fill="#02030a" fill-opacity=".34"`)}
      <g filter="url(#${id}s)" opacity=".55">${use(`fill="none" stroke="${c1}" stroke-width="10"`)}</g>
      ${use(`fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"`)}
    </g>
  </g>
  ${use(`fill="none" stroke="url(#${id}r)" stroke-width="8"`)}
  <g filter="url(#${id}t)">
    <g transform="translate(256 256) scale(.955) translate(-256 -256)">${use(`fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="170 1500" stroke-dashoffset="-860" stroke-linecap="round"`)}</g>
    <g transform="translate(256 256) scale(.955) translate(-256 -256)" opacity=".8">${use(`fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="90 1500" stroke-dashoffset="-250" stroke-linecap="round"`)}</g>
  </g>
  <g filter="url(#${id}n)" fill="none" stroke="url(#${id}i)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">${icon.replaceAll('$fill', `url(#${id}i)`)}</g>
</svg>`;
}
const ICON = {
  faq: `<path d="M204 214a54 54 0 1 1 86 43c-22 15-32 26-32 50"/><circle cx="258" cy="352" r="6" fill="$fill"/>`,
  eye: `<path d="M134 256c32-54 73-80 122-80s90 26 122 80c-32 54-73 80-122 80s-90-26-122-80z"/><circle cx="256" cy="256" r="34"/>`,
  spark: `<path d="M240 150l25 77 77 25-77 25-25 77-25-77-77-25 77-25z" fill="$fill" stroke-width="10"/><path d="M352 296l11 33 33 11-33 11-11 33-11-33-33-11 33-11z" fill="$fill" stroke-width="8"/>`,
};
const GEM = {
  faq: () => gem({ shape: 'squircle', c1: '#5fd0ff', c2: '#1d4f9c', icon: ICON.faq }),
  coulisses: () => gem({ shape: 'circle', c1: '#ffbe55', c2: '#a0481a', icon: ICON.eye }),
  nouveau: () => gem({ shape: 'hex', c1: '#ff7fc4', c2: '#7a2a8c', icon: ICON.spark }),
};

/* ---------- Couvertures ---------- */
const cover = (id, photo, c, inner) => `<section class="hl" id="hl-${id}" style="--c:${c}">
  <div class="ph" style="background-image:url(${ST}${photo})"></div><div class="tint"></div><div class="lens"></div>
  <div class="gem">${inner}</div></section>`;
const COVERS = [
  ['appli', 'gym-5-cage.jpg', '#ffffff', `<div class="appicon"></div>`],
  ['reposts', 'gym-3-airbike.jpg', '#4f8dff', `<img src="assets/gemme-regulier.png" alt="">`],
  ['collabs', 'gym-4-mur.jpg', '#8a6bff', `<img src="assets/gemme-binome.png" alt="">`],
  ['badges', 'gym-4-mur.jpg', '#ff8a3b', `<img src="assets/gemme-en-feu.png" alt="">`],
  ['faq', 'gym-6-cardio.jpg', '#5fd0ff', GEM.faq()],
  ['coulisses', 'gym-2-rack.jpg', '#ffbe55', GEM.coulisses()],
  ['cercle', 'gym-6-cardio.jpg', '#b07bff', `<img src="assets/gemme-en-duo.png" alt="">`],
  ['nouveau', 'gym-5-cage.jpg', '#ff7fc4', GEM.nouveau()],
];

/* ---------- Stories ---------- */
const story = (id, photo, c, tag, body) => `<section class="st" id="st-${id}" style="--c:${c}">
  <div class="ph" style="background-image:url(${ST}${photo})"></div><div class="veil"></div>
  <img class="logo" src="../profil/assets/ecriture-reiz-blanc-trim.png" alt="Reiz">
  <div class="tag glass">${tag}</div>${body}</section>`;

const faq = (n, q, a, extra, hint, gemTop) => story('faq-' + n, 'gym-6-cardio.jpg', '#5fd0ff', `FAQ ${n}/4`, `
  <div class="in">
    <h1>${q}</h1>
    <div class="panel glass"><div class="answer">${a}</div></div>
    ${extra}
  </div>
  <div class="float" style="right:30px;top:${gemTop}px;width:128px;height:128px;transform:rotate(10deg)">${GEM.faq()}</div>
  <div class="hint" style="right:170px">${hint}</div>`);

const STORIES = [
  story('collabs', 'gym-4-mur.jpg', '#8a6bff', 'Collabs', `
  <div class="in">
    <h1>On monte un truc ensemble&nbsp;?</h1>
    <div class="sub" style="max-width:262px">Salles, clubs, créateurs&nbsp;: <b>tu proposes, on suit.</b></div>
    <div class="panel glass" style="margin-top:24px;padding-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px;padding-bottom:8px">
        <div style="display:flex">
          <div class="appicon" style="width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)"></div>
          <div class="av" style="width:44px;height:44px;margin-left:-10px;border:2px solid #3a3a40;background:#fff;color:#000;font-size:13px">Toi</div>
        </div>
        <div style="flex:1"><div class="lab">Duo</div><div style="font:800 17px/21px Inter;letter-spacing:-.02em">Reiz × toi</div></div>
        <div class="fp clear" style="font-size:13px;padding:8px 13px 8px 10px">${I('check')}Duo validé</div>
      </div>
      <div class="row"><div class="ic clear">${I('flame')}</div><div><div class="t">Un défi dans ta salle</div><div class="d">Tes adhérents se motivent entre eux.</div></div></div>
      <div class="row"><div class="ic clear">${I('camera')}</div><div><div class="t">Un reel à deux</div><div class="d">On tourne chez toi, on publie ensemble.</div></div></div>
      <div class="row"><div class="ic clear">${I('people')}</div><div><div class="t">Une séance commune</div><div class="d">Ton club, notre cercle, même créneau.</div></div></div>
      <div class="btn" style="margin-top:8px">Écris-nous en message</div>
    </div>
  </div>
  <img class="float" src="${badge('binome')}" alt="" style="right:16px;top:236px;width:112px;transform:rotate(12deg)">`),

  story('reposts', 'gym-3-airbike.jpg', '#4f8dff', 'Vos séances', `
  <div class="in">
    <h1>Tu postes.<br>On te reposte.</h1>
    <div style="position:relative;margin-top:30px;height:330px">
      <div style="position:absolute;left:0;top:0;width:214px;transform:rotate(-3deg);transform-origin:20% 80%">
        <div style="display:flex;align-items:center;gap:9px;padding:0 2px 9px">
          <div class="av" style="width:34px;height:34px;font-size:13px">T</div>
          <div><div style="font:700 13px/16px Inter">Théo</div><div style="font:400 11px/14px Inter;color:rgba(235,235,245,.62)">Aller à la salle 4 fois</div></div>
        </div>
        <div class="media" style="width:214px;height:238px;background-image:url(${ST}photo-seance.jpg)"></div>
        <div class="gauge" style="margin-top:11px;padding:0 2px"><div class="gt"><div class="gf" style="width:75%"></div></div><div class="gl">3 / 4 séances</div></div>
      </div>
      <div class="fp fl" style="position:absolute;right:0;top:54px"><span class="n">1</span>Poste ta séance</div>
      <div class="fp fl" style="position:absolute;right:-6px;top:128px"><span class="n">2</span>Partager en story</div>
      <div class="fp fl" style="position:absolute;right:0;top:202px"><span class="n">3</span>Identifie @reiz_officiel</div>
    </div>
  </div>
  <img class="float" src="${badge('regulier')}" alt="" style="right:54px;top:508px;width:104px;transform:rotate(10deg)">
  <div class="hint" style="top:612px">Les séances repostées restent dans cet onglet.</div>`),

  faq(1, "C'est gratuit&nbsp;?", "<b>Oui.</b> Reiz se télécharge gratuitement sur l'App Store.", `
    <div class="panel fl" style="margin-top:14px;display:flex;align-items:center;gap:13px;padding:14px 16px 14px 14px">
      <div class="appicon" style="width:52px;height:52px;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)"></div>
      <div style="flex:1"><div style="font:800 17px/21px Inter;letter-spacing:-.02em">Reiz</div><div style="font:400 12.5px/16px Inter;color:rgba(235,235,245,.62)">Gratuit sur l'App Store</div></div>
      <div class="pill on" style="padding:9px 15px">Télécharger</div>
    </div>`, 'Le lien est dans la bio.', 452),

  faq(2, "Qui voit mes séances&nbsp;?", "<b>Toi seul décides</b>, objectif par objectif. Tu peux changer d'avis à tout moment.", `
    <div class="lab" style="margin:22px 0 10px 4px">Visibilité</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <div class="pill on">${I('people')}Mon cercle</div><div class="pill">${I('star')}Cercle proche</div>
      <div class="pill">${I('lock')}Privé</div><div class="pill">Public</div>
    </div>`, 'Mon cercle est le réglage par défaut.', 512),

  faq(3, "C'est quoi un duo&nbsp;?", "Tu identifies un ami sur ta séance. Si vous postez <b>à moins d'une heure d'écart</b>, le duo est validé.", `
    <div class="panel fl" style="margin-top:14px;padding:16px 18px">
      <div style="display:flex;align-items:center">
        <div style="text-align:center"><div class="av" style="margin:0 auto">H</div><div style="font:700 12px/15px Inter;margin-top:5px">Hugo</div><div style="font:400 11px/14px Inter;color:rgba(235,235,245,.62)">18 h 02</div></div>
        <div style="flex:1;margin:0 10px 30px;position:relative;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.25),#fff,rgba(255,255,255,.25))">
          <div class="pill on" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 11px;font-size:12px;line-height:15px">${I('check')}Duo validé</div>
        </div>
        <div style="text-align:center"><div class="av" style="margin:0 auto">T</div><div style="font:700 12px/15px Inter;margin-top:5px">Théo</div><div style="font:400 11px/14px Inter;color:rgba(235,235,245,.62)">18 h 40</div></div>
